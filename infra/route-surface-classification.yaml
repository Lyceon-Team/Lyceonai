# Route-surface-classification registry — Doc 06A §5.3.1 (fields extended per RB-06A-V1-11).
#
# @spec [Doc-06A §5.3.1; Doc-06B §11.4, §12.2 (RB-06A-V1-11); docs/plans/seo/seo-marketing-vertical.md §5 F12, F1, F3]
# @implemented [2026-10-03]
# plain English: the ONE inventory of client routes. Every <Route path> in client/src/App.tsx
# (and the GUARDIAN_ROUTES table) has exactly one row here; `pnpm run route:validate` fails in
# CI on a route missing from this file or a row naming no route. docs/route-registry.md is prose
# (roles, entitlements, endpoints) checked against this file by the same script.
#
# Doc 06A fields: path_pattern, surface_class, clarity_allowed, masking_required, owning_doc,
# last_classified_at. RB-06A-V1-11 fields: is_internal_api, requires_cloudflare_access,
# requires_hmac (every row here is a client page, so all three are false).
#
# Owner-approved extension fields (2026-10-03, SEO Wave 1A):
#   prerender      true = built to static HTML at deploy time (scripts/build/prerender.mjs).
#   indexable      true = listed in sitemap.xml. A public route that is not content (login,
#                  redirects) stays unauth_marketing with prerender/indexable false.
#   last_modified  sitemap lastmod for a static page (YYYY-MM-DD) — the date its content last
#                  changed. Required when prerender is true and content_source is absent.
#   content_source blog | legal | qotd — a parameterised page expanded from that content source
#                  (qotd: the past Question of the Day dates, read at build time).
#   redirect_to    a permanent (301) redirect served by vercel.json.
#
# Format: a strict YAML subset parsed by shared/seo/route-registry.ts — one `key: value` per
# line, `- ` opens a row, `#` comments. Anything else fails the parse (and the build).

