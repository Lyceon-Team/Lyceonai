# ═══════════════════════════════════════════════════════════════════════
# SECTION 6 — QUESTIONS FOR KARL (owner: unspecified entries)
# ═══════════════════════════════════════════════════════════════════════
#
# The following entries have canonical_owner: "unspecified" because no
# spec section was found that mandates their existence. Karl's ruling
# requested these be listed as numbered questions.
#
# Q1: RESEND_API_KEY — Which spec section owns the email notification
#     channel? Currently absent from all spec docs.
#
# Q2: CRON_SECRET — Should this be documented under Doc-06B §9 (abuse
#     queue cron) or a separate operational-auth section?
#
# Q3: ADMN_PASSCODE — Is this an intentional misspelling or a leftover?
#     No spec section references admin passcode-based provisioning.
#
# Q4: ERROR_MONITOR_WEBHOOK_URL / ERROR_MONITOR_ENABLED /
#     ERROR_MONITOR_TIMEOUT_MS — These implement an alerting webhook
#     that is not documented in any spec. Should they be owned by
#     Doc-06B §10 (rate-limit config audit) or a new section?
#
# Q5: SERVICE_NAME — Logger default. Should this be owned by Doc-01A
#     observability or Doc-06B operational?
#
# Q6: SITE_URL / APP_BASE_URL — Overlap with PUBLIC_SITE_URL. Should
#     these be consolidated?
#
# Q7: SUPABASE_DB_URL — Direct DB connection URL. Is this intentional
#     or a vestige? Not referenced in any spec.
#
# Q8: OCR_PROVIDER / DOC_AI_PROCESSOR / GCP_LOCATION / MATHPIX_* /
#     QA_LLM_ENABLED / VECTORS_ENABLED / TOP_K / DOC_AI_MAX_* /
#     OCR_ENABLE_* — All OCR/Document AI config. None referenced in
#     any spec doc. Should these have a spec home?
#
# Q9: GCS_BUCKET_NAME / PUBSUB_TOPIC / RATE_LIMIT_* — ConfigManager
#     vars. No spec ownership found.
#
# Q10: EMBEDDINGS_MODEL / NEXTAUTH_ENABLED — Healthz-only reporting
#      vars. Should they be in the manifest at all?
#
# Q11: CORS_ORIGINS — Not referenced in any spec. Overlaps with
#      CSRF_ALLOWED_ORIGINS. Should these be unified?
#
# Q12: ADMIN_PROVISION_ENABLE / ACCOUNT_DELETION_LIFECYCLE_V2 —
#      Feature flags with no spec ownership. Intended to be temporary?
