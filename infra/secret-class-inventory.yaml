# infra/secret-class-inventory.yaml
#
# @spec  [Doc-06B §4.2]
# @implemented 2026-09-03
#
# Runtime Configuration Manifest & Secret-Class Inventory
#
# Enumerates every configuration value across the three Lyceon runtimes:
#   1. Vercel BFF  (server/, apps/api/)
#   2. Cloud Run worker  (apps/workers/tutor-orchestrator/)
#   3. Supabase config tables  (tutor_context_runtime_config)
#
# Schema extension rationale (Doc 06B §4.2 base + brief-mandated fields):
#   06B §4.2 defines secret_classes with fields oriented toward secrets
#   (rotation_owner, last_rotated_at). This manifest extends the schema to
#   cover ALL runtime configuration values, adding the fields the brief
#   mandated: required, default, absence_behavior, consumer.
#
#   Extended store enum values (beyond 06B §4.2):
#     - cloud_run_env        (Cloud Run environment variables)
#     - supabase_config_table (tutor_context_runtime_config rows)
#     - cloudbuild_only      (set in cloudbuild.yaml but never read — dead config)
#
#   Extended fields per entry:
#     - runtime:           [vercel_bff | cloud_run_worker | supabase_config]
#     - required:          boolean
#     - default:           the hardcoded fallback, or null if none
#     - absence_behavior:  [crash | fail_closed | silent_default | skip_with_warning | derived]
#     - consumer:          list of file:line references (primary read sites)
#     - secret_class:      which §4.1 class this belongs to, or "none" for non-secrets
#
#   Fields rotation_owner and last_rotated_at are omitted for non-secret entries.

schema_version: "1.0.0"

