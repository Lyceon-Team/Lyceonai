  # One definition, and the sweep reads it.
  - policy_id: RPOL-NOTIF-01
    pii_surface_name: 'notification_messages.body'
    canonical_owner_doc_and_section: 'legal/privacy-policy/v4/en.md §6.1'
    classification: content
    retention_horizon_months: null
    calendar_month_semantics: null
    retention_horizon_seconds: 7776000        # 90 days
    partial_provable_until: null
    purge_substrate: scheduled_job
    purge_lag_allowance_seconds: 86400        # one missed nightly run
    purge_alert_id: null                      # see prerequisites
    out_of_scope: false
    out_of_scope_reason: null
    last_reviewed_at: 2026-09-22

