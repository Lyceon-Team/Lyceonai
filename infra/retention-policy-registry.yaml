  # ── Privacy Policy v4 §6.5 — configuration records, PERMANENT ───────
  # PERMANENT BY RULING, and that is now what the policy says. SCL-105 put two
  # options to the owner — sweep the tables by extending the SCL-087 exemption,
  # or amend §6.5 — and the ruling of 2026-09-22 took the amendment: "those 19
  # tables are tamper-evident governance records, they carry no student
  # identity after SCL-093, and weakening their guard to honour a deletion
  # promise about operator records is backwards."
  #
  # So there is no period to enforce and nothing is blocked. Eighteen
  # *_config_history tables plus mastery_constants_history and
  # abuse_score_incidents keep the shared public.prevent_update_delete()
  # trigger (Doc 01A §5, "History is append-only") intact.
  #
  # IT IS STILL A PII SURFACE, which is why the row stays. The column named
  # here holds the profile id of the STAFF MEMBER who made a change. SCL-093
  # severs it when that person's own account is deleted (ON DELETE SET NULL),
  # but until then it is personal data about an identifiable person — which is
  # why v4 §6.5 says these records "describe our operations, not you" and does
  # NOT claim they contain no personal information at all.
  #
  # SCL-107 FINDING (a), SECOND INSTANCE: permanent-by-design, not pending a
  # forward-ref, so both horizon fields and the token are null — which §9.3 (i)
  # fails. The first instance was RPOL-SUPPRESS-01, filed hours earlier. Two
  # rows in one registry is no longer an edge case in the schema; it is a
  # missing value.
  - policy_id: RPOL-CONFIG-01
