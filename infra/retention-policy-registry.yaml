# ──────────────────────────────────────────────────────────────────────
# infra/retention-policy-registry.yaml
#
# @spec [Doc-06D_V1.0 §9.1 (schema) + §9.2 (hard rules) + §9.3
#        (ci/retention-policy-registry-parity) + §9.4
#        (ops/retention-policy-conformance); Doc-07E_V1.0 §6 (the two
#        analytics-layer entries, consumed verbatim); Privacy Policy v4 §6
#        (the eleven published periods); owner ruling 2026-09-22 F1]
# @implemented [2026-09-22]
#
# plain English: the machine-readable inventory Doc 06D §9.1 calls for — one
# row per PII surface, mapping it to the period we publish for it, the thing
# that actually performs the purge, and how late that purge may be before it
# is a problem.
#
# expected outcome: every period in Privacy Policy v4 §6 has a row here, and
# each row names a real mechanism or says plainly that none exists. A reader
# can go from a sentence in the policy to the function that enforces it, or
# to the reason it is a commitment rather than a description.
#
# WHY THIS FILE EXISTS NOW AND NOT BEFORE. SCL-093's amendment recorded that
# "this build does not write [the registry] because the registry substrate is
# the owner's." The owner ruling of 2026-09-22 (F1) supersedes that: "take
# CC's proposal. Per-PII-surface as §9.1 defines it, covering what the eleven
# periods govern, with the missing alert registry recorded as a named
# prerequisite and an SCL rather than pretended into existence." This file is
# that. The earlier position is noted so the reversal is visible rather than
# looking like drift.
#
# HOW TO READ A ROW. `retention_horizon_*` is what we publish.
# `purge_substrate` is what performs it. `enforced` is not a §9.1 field and
# is not invented here — it is in the comment above each row, because a
# registry that cannot distinguish "365 days, swept nightly" from "365 days,
# nobody deletes anything" is the exact defect SCL-101 catalogued.
#
# trade-offs:
#  - `canonical_owner_doc_and_section` cites the PUBLISHED privacy policy
#    (`legal/privacy-policy/v4/en.md §6.x`) for every period the policy is
#    what publishes, and a `docs/Spec` section only where a spec section is
#    the owner of the number. §9.2 rule 2 requires the citation to resolve to
#    "a referenced doc + § anchor"; the published policy is a versioned,
#    immutable, section-numbered document in this repo, and it is the document
#    users are shown and the acceptance ledger records consent against. Where
#    the `docs/Spec` draft and the published policy disagree, the published
#    one is the promise. Recorded in SCL-107 for ratification.
#  - Rows are per SURFACE, not per sweep. Two tables swept by one function
#    get two rows when the policy speaks about them separately, and one row
#    when the policy speaks about them as a class.
#  - `last_reviewed_at` is the date this file was written. §9.3 failure
#    condition (f) fails any row older than 180 days, which is the intended
#    pressure: these are review commitments, not set-and-forget values.
#
# edge cases / KNOWN §9.3 FAILURES, ALL DELIBERATE AND ALL RECORDED:
#  - §9.3 (d) every `purge_alert_id` must resolve in `infra/alert-registry.yaml`
#    (Doc 06C §7). THAT FILE DOES NOT EXIST — see `prerequisites` below. Every
#    `purge_alert_id` here is therefore null, which is what Doc 07E §6 does for
#    the same reason under INV-07-09.
#  - §9.3 (g) a `manual` purge_substrate with no `purge_alert_id` fails. Six
#    rows are `manual` because no mechanism exists, and none can carry an
#    alert id until the alert registry does. The same prerequisite.
#  - §9.3 (i) a null `retention_horizon_*` is permitted ONLY under a
#    `partial_provable_until` forward-ref token. RPOL-SUPPRESS-01 has a null
#    horizon and no token, because "held until the user revokes it" is
#    deliberately indefinite and is not pending anything. The schema has no
#    way to say that. SCL-107 finding (a).
#  - RPOL-CONSENT-02's published period is "no less than three years from
#    consent, OR one year after the subscription ends, whichever is longer."
#    The schema holds one scalar. The floor is encoded and the compound term
#    is lost. SCL-107 finding (b).
#  - No `purge_substrate` value describes a NATIVE SUBSTRATE TTL — a
#    substrate that deletes on its own, with no job, no operator and no run
#    record for §9.4 (e) to read. `manual` is false in both directions. The
#    row that needed it was RPOL-ANALYTICS-04, the BigQuery archive, and that
#    surface is now deleted (below), so nothing in this file is blocked on it
#    today. SCL-107 finding (c) stays filed: the next native-TTL substrate
#    hits the same gap and the schema will still have nothing to say.
# ──────────────────────────────────────────────────────────────────────

# Not a §9.1 field. Named here because §9.3 cannot run without it, and
# because "the alert registry is missing" is otherwise invisible in a file
# whose every alert id is null.
prerequisites:
  - path: infra/alert-registry.yaml
    owning_doc_and_section: Doc 06C V1.0 §7
    required_by: Doc 06D V1.0 §9.3 failure conditions (d) and (g)
    status: absent
    # One line, deliberately: scripts/ci/lib/minimal-yaml.ts does not read block
    # scalars, and it throws rather than mis-parsing one.
    consequence: 'Every purge_alert_id in this file is null, and the manual-substrate rows cannot satisfy 9.3(g) at all. ci/retention-policy-registry-parity cannot be implemented until this file exists. Filed as SCL-107; not created here, because an alert registry with no rotation owner and no runbook is the condition Doc 07 Parent 4 gives as the reason for the INV-07-09 negative invariant.'

