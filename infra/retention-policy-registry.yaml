  # ── Privacy Policy v4 §6.6 — the BigQuery retention archive: REMOVED ─
  # There is no RPOL-ANALYTICS-04. The row existed in the first draft of this
  # file, for the four `retention__*` tables the 90d and 180d sweeps used to
  # export to, with a 730-day partition expiration.
  #
  # The owner ruling of 2026-09-22 removed the archive instead: "stop
  # archiving, delete outright ... the archive carries student_id, reviewer_id
  # and free-text notes about minors in crisis. BigQuery is the worst home for
  # those. Nothing has ever been archived, so there's nothing to migrate."
  #
  # The row is deleted rather than kept with a null horizon because the surface
  # itself is gone. Nothing was ever written to it — the archive client's
  # dependency was never installed — and `server/services/retention-archive.ts`,
  # its generator, its drift gate and its four schema files are deleted as of
  # 2026-09-22. Registering a retention policy for a surface that never held a
  # row and no longer exists would be the registry documenting something that
  # does not exist: the failure mode this file is meant to end, pointed the
  # other way.
  #
  # No coverage is lost. RPOL-ANALYTICS-04 described the BigQuery COPY of
  # those rows, not the Postgres originals; the originals are deleted by the
  # sweeps themselves and were never a row in this file — their four tables
  # (tutor_instruction_assignments, tutor_instruction_exposures,
  # crisis_review_cases, tutor_injection_log) are not surfaces the published
  # policy names a period for, so they sit under §6.7's catch-all like every
  # other operational table. With the copy gone there is one location fewer,
  # not one policy fewer.
  #
  # §6.6 is still covered: RPOL-ANALYTICS-03 above carries the Vercel
  # analytics surface, which is what §6.6 actually governs now. See SCL-106.
  #
  # ── Privacy Policy v4 §6.7 — the catch-all, 90 days ─────────────────
  # ENFORCED as of 2026-09-21. public.operational_log_retention_days()
  # returns a literal 90 and public.sweep_operational_log_retention sweeps
  # four tables, each on the column the migration names:
  # usage_rate_limit_ledger.created_at, rate_limit_ledger.window_end (it has
  # no created_at and its updated_at moves on every increment),
  # tutor_turn_metrics.recorded_at, tutor_context_resolution_log.resolved_at.
  # §6.7 remains a BUILD COMMITMENT in one respect: there is no gate that
  # would notice a NEW identity-bearing table accumulating outside the ten
  # enumerated categories. SCL-101 records that.
  - policy_id: RPOL-OPS-01
    pii_surface_name: 'tutor_context_resolution_log.student_id'
    canonical_owner_doc_and_section: 'legal/privacy-policy/v4/en.md §6.7'
