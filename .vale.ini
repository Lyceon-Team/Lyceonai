# Prose style for pipeline content (Doc 10B §5 gate 6, §9; owner decision 2026-10-11: "Vale:
# Microsoft (error level) plus ai-tells, pinned, as proposed").
#
# Packages are pinned by versioned release URL; `vale sync` downloads them into .vale/styles
# (gitignored, except the Lyceon vocabulary). Only error-level alerts fail the gate.
# CI: scripts/content/lint-prose.sh (installs nothing itself; see .github/actions/content-tools).
StylesPath = .vale/styles
MinAlertLevel = error
Vocab = Lyceon

Packages = https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

[*.md]
BasedOnStyles = Vale, Microsoft, ai-tells

# One rule off, with its reason (Doc 10B: a tuning pass "recorded in .vale.ini, not by disabling
# the package"). ai-tells' own message says to disable it "for prose about people"; SAT prose says
# "the question asks for", which is about a test item, not an AI tell. Checked 2026-10-11 against
# the five 2024 posts. Every other ai-tells rule stays at error.
ai-tells.AnthropomorphicCognition = NO
