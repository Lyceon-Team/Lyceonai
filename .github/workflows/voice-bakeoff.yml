# The GCP voice bake-off: a single run, as a job on its own pull request (Karl's step-1 rulings,
# 2026-11-11, option (b)). It voices the W46 Nov 11 worked example in four Chirp 3 HD voices and
# Gemini 2.5 Flash TTS through lyceon-ci-eval, the identity LISA's Vertex jobs use from GitHub
# Actions (Workload Identity Federation, no stored key), normalises and limits every line, and
# uploads the lines and report.json as an artifact. Nothing is committed or posted. It runs only
# when this file or the bake-off code changes; it has no schedule.
name: Voice bake-off

on:
  pull_request:
    paths:
      - .github/workflows/voice-bakeoff.yml
      - scripts/worked-examples/voice-bakeoff.ts
      - scripts/worked-examples/google-tts.ts

permissions:
  contents: read

concurrency:
  group: voice-bakeoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bakeoff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout (code)
        uses: actions/checkout@v4

      - name: Checkout social (content)
        uses: actions/checkout@v4
        with:
          ref: social
          path: social
          sparse-checkout: content/worked-examples/2026-W46/SATM2IF0OE0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/480325859530/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: lyceon-ci-eval@replit-cop.iam.gserviceaccount.com

      - name: Voice the bake-off
        env:
          OUT: ${{ runner.temp }}/voice-bakeoff
        run: |
          pnpm exec tsx scripts/worked-examples/voice-bakeoff.ts \
            --example social/content/worked-examples/2026-W46/SATM2IF0OE0 --out "$OUT"

      - name: Upload the lines and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-bakeoff
          path: ${{ runner.temp }}/voice-bakeoff
          if-no-files-found: ignore
          retention-days: 7
