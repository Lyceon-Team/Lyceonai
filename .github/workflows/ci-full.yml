# THE FULL TIER (owner decisions 2026-10-07 on the CI audit, items 2-3).
#
# Everything the fast lane (ci.yml) does not run on every pull request runs here, once, on the
# exact head a pull request into `main` is about to merge, and on `main` itself: the review UI
# mutation gate's every plant, every Postgres mutation harness and self-test, the seeded
# 3,000-plan calendar parity suite, the gate self-tests, the guardian browser specs, the page-CSP
# flow sweep and the question-authoring test. Together with ci.yml this is the full suite.
#
# TRIGGER (owner brief 2026-10-08). Every pull request into `main` runs the full tier
# automatically on every head — no label. A pull request into `cleanup` runs it only when it
# carries the `ci:full` label (opt-in). It also runs on every push to `main` whose tree no passing
# full-tier run already covered. A tree that already passed is never re-run (tree marker).
# Cost: integration branches keep a pull request open into `main` and every merge into the branch
# updates it, so this runs on each of those updates; `cancel-in-progress` keeps one run per PR.
# WALL TIME (Karl, 2026-10-11): the two long jobs are split so neither is the critical path —
# the review UI gate across `review-ui-gate-shard` jobs (totals checked by `review-ui-gate`) and
# `pg-mutations` across a matrix of groups. Same steps, same plants, same per-plant proof.
#
# THE REQUIRED CHECK is the last job, `ci-full` (scripts/ci/ci-full-verdict.sh). On a pull request
# into `main` it is green only when, on this exact tree, the full tier ran and passed (this run,
# or an earlier one recorded by its tree marker); otherwise red. On a pull request into `cleanup`
# without the label it is green and says the tier was not requested; with the label it must pass.
# After a labelled run the label is removed, so a later push needs a fresh `ci:full`.
# Owner action: make `ci-full` a required status check on `main`.
name: CI full tier

on:
  pull_request:
    branches: [main, cleanup]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

# A new head (opened, synchronize, reopened) cancels the run still testing the old one. A label
# event never does (CI wall-time brief, Karl 2026-10-11): it waits behind the run in progress, then
# finds that tree already passed (tree marker) and goes green in about a minute. Before this, adding
# `ci:full` to a pull request into `main` (where it is implied) restarted a full tier that had been
# running for up to 17 minutes on the same head.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-full-pr-{0}', github.event.pull_request.number) || format('ci-full-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' }}

env:
  CI: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
      satisfied: ${{ steps.scope.outputs.satisfied }}
      required: ${{ steps.scope.outputs.required }}
      tree: ${{ steps.scope.outputs.tree }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether the full tier runs
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          HAS_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/ci/ci-full-scope.sh

  # The review UI mutation gate, every plant, split across REVIEW_UI_GATE_JOBS jobs of 4 worktrees
  # (CI wall-time brief, Karl 2026-10-11: ~21 minutes in one job was the full tier's critical path).
  # Same plants, same proof per plant: each job runs its global shards through
  # review-ui-gate.parallel.sh, which applies each plant, requires its named test red and every
  # worktree byte-identical to HEAD. The `review-ui-gate` job below checks the totals across jobs.
  review-ui-gate-shard:
    runs-on: ubuntu-latest
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        job: [0, 1, 2, 3, 4, 5]
    env:
      REVIEW_UI_GATE_JOBS: "6"
      REVIEW_UI_GATE_SHARDS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No version pin here: pnpm version is derived from package.json
        # "packageManager" — single source of truth (Q2).

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Review UI mutation gate — this job's shards of every plant (proves U1-U9 are load-bearing)
        env:
          REVIEW_UI_GATE_JOB: ${{ matrix.job }}/${{ env.REVIEW_UI_GATE_JOBS }}
          REVIEW_UI_GATE_SUMMARY: ${{ runner.temp }}/review-ui-gate-summary-${{ matrix.job }}.txt
        run: bash scripts/ci/review-ui-gate.parallel.sh

      - name: Upload this job's shard summary
        uses: actions/upload-artifact@v4
        with:
          name: review-ui-gate-summary-${{ matrix.job }}
          path: ${{ runner.temp }}/review-ui-gate-summary-${{ matrix.job }}.txt
          if-no-files-found: error
          retention-days: 7

  # Every plant ran exactly once and went red, across all the shard jobs: each global shard
  # reported once, the same plant total everywhere, ran = red = total, all on this head.
  review-ui-gate:
    runs-on: ubuntu-latest
    needs: [scope, review-ui-gate-shard]
    if: ${{ always() && needs.scope.outputs.run == 'true' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download every shard job's summary
        uses: actions/download-artifact@v4
        with:
          pattern: review-ui-gate-summary-*
          path: ${{ runner.temp }}/review-ui-gate-summaries
          merge-multiple: true

      - name: Review UI mutation gate — totals across every shard (every plant red exactly once)
        env:
          SHARD_RESULT: ${{ needs.review-ui-gate-shard.result }}
        run: |
          echo "shard jobs: $SHARD_RESULT"
          bash scripts/ci/review-ui-gate.combine.sh "${{ runner.temp }}/review-ui-gate-summaries" 6 4
          [ "$SHARD_RESULT" = success ] || { echo "::error::a shard job ended $SHARD_RESULT"; exit 1; }

  gate-selftests:
    runs-on: ubuntu-latest
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No version pin here: pnpm version is derived from package.json
        # "packageManager" — single source of truth (Q2).

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (including the Vercel production bundle)
        run: pnpm run build:vercel


      - name: Boot probe self-test (proves each failure mode turns it red)
        run: bash scripts/ci/boot-probe.selftest.sh

      - name: Section vocabulary self-test (proves each mutation turns it red)
        run: bash scripts/ci/section-vocabulary-gate.mutations.sh

      - name: Fixture canonicality self-test (proves each mutation turns it red)
        run: bash scripts/ci/test-fixture-canonicality-gate.selftest.sh

      # Guardian closeout, Part B step 4: no unused export and no test-only module in guardian
      # scope (scripts/ci/guardian-dead-code-gate.mjs — the TypeScript compiler API over the
      # repository's import graph, no new dependency). The self-test runs FIRST: it plants an
      # unused export and a test-only module and requires the gate to name each, so a gate that
      # has gone blind reads as a failure here rather than as a clean tree.
      - name: Guardian dead-code gate self-test (planted findings must be named)
        run: bash scripts/ci/guardian-dead-code-gate.selftest.sh

      # Question-authoring tooling (scripts/assemble-batch.ts): no production entry imports it,
      # so the fast lane runs this file only when the tooling changes.
      - name: Question-authoring gate tests (tests/assemble-batch.test.ts)
        run: pnpm exec vitest run tests/assemble-batch.test.ts

  # Four jobs, one per group (CI wall-time brief, Karl 2026-10-11: ~15 minutes in one job). Every
  # step still runs, each in exactly one group (tests/ci/ci-full-workflow-shape.test.ts holds that:
  # a new step without a group is red). Groups keep their dependencies together: the calendar
  # parity steps read the database the pipeline step builds, and the PostgREST harness stays last
  # on its server. Each job has both servers, so every step keeps its port.
  pg-mutations:
    runs-on: ubuntu-latest
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [deletion, qotd, review-marketing, calendar-migrations]
    services:
      # Two servers, one job (owner decision 2026-10-07, CI audit item 2: "Postgres jobs
      # consolidated"). Every script and test creates its own database, so the eleven jobs that
      # each started a server now share these two. pg16 (port 5432) is the pipeline's genesis
      # major; pg17 (port 5433) is production's, which the calendar formula is proved on (Doc 05F
      # formula sheet §6) — the calendar steps set PGPORT 5433. The two PostgREST gates run LAST
      # on their server: each sets BYPASSRLS on service_role, which is cluster-wide.
      postgres:
        image: pgvector/pgvector:pg16   # genesis declares the `vector` extension
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres17:
        image: pgvector/pgvector:pg17   # prod major; the calendar parity gate requires it
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No version pin here: pnpm version is derived from package.json
        # "packageManager" — single source of truth (Q2).

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure postgresql-client 16
        uses: ./.github/actions/ensure-psql16

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # INV-08-18 through the REAL transport. The recorder-based launch tests prove the
      # sequence ARITHMETIC; only this proves that calendar_link_launch and the practice
      # engine's own idempotency ledger, reached over a wire as a real service_role JWT,
      # agree about what a repeated key means. The gate greps its own output because a
      # self-skipping vitest file exits 0 and reads green from the outside.
      - name: Install PostgREST (real transport)
        run: |
          curl -sL -o /tmp/pgrst.tar.xz \
            https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz
          tar -xf /tmp/pgrst.tar.xz -C /tmp
          sudo mv /tmp/postgrest /usr/local/bin/postgrest
          postgrest --version

      # ── pg16 (port 5432) ──────────────────────────────────────────────────────────

      # @spec [Guardian_Closure_Plan G1-08; audit G-AUD-11] | @implemented [2026-09-29]
      # GATE 0 pins the gate's body. The harness proves it bites: dropping status='active'
      # and a one-id backdoor (which no behavioural gate's fixtures can see) must each red
      # the gate ON GATE 0. The target migration is resolved as the LAST definer, so a
      # newer CREATE OR REPLACE can never leave this mutation aimed at a dead body.
      - name: guardian_view_decision gate — body-pin mutations
        if: matrix.group == 'review-marketing'
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/guardian-view-decision-gate.mutations.sh

      # The G2-04 assertions are worth what their plants prove. One product-source mutation per
      # property (no link read; the student-or-admin mounts lose the gate; the link answer cached
      # per student — the stored-flag design; a learning read and checkout ungated; the gate
      # reaching a paying guardian; G2-06: the known-age check removed), each required to turn
      # its assertion red, each reverted byte-identically in a trap.
      - name: Under-13 link gate and known-age check proven by planted violations (G2-04 P1-P6, G2-06 P7, Brief 8 P8)
        if: matrix.group == 'review-marketing'
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ci/under-13-link-gate.mutations.sh

      # A gate is worth its red proof. Nine mutations, one per assertion; M1 re-plants the
      # PRE-D1 behaviour (the case insert's failure swallowed, the flag left standing) and
      # requires D1.3 to notice.
      - name: Crisis flag atomicity self-test (proves each mutation turns it red)
        if: matrix.group == 'deletion'
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ci/crisis-flag-atomic.mutations.sh

      - name: Deletion evidence bundle → mutation self-test (every gate observed red once)
        if: matrix.group == 'deletion'
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ci/deletion-evidence-gate.mutations.sh

      # SCL-235 / SCL-236 (owner rulings 2026-10-16/17): the stored diagnostic projection, the one
      # completion path and the free/paid read split. Each rule (session-only events, write-once,
      # replay/race, one in-flight diagnostic, abandoned, live refresh at completion, repair,
      # grants, deletion L1-14, the read split, the single-writer guard) is planted and must turn
      # its named check red.
      - name: Diagnostic projection mutations (planted defects must fail)
        if: matrix.group == 'deletion'
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ci/diagnostic-projection.mutations.sh

      # The fourteen review-route assertions (practice-integration, "Review API + queue end-to-end")
      # are worth exactly as much as their plants. This mutates product source once per
      # assertion and fails the build unless that assertion goes red. It patches the working
      # tree and restores it in a trap.
      - name: Review route assertions proven by planted violations (A1-A14)
        if: matrix.group == 'review-marketing'
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ci/review-routes-gate.mutations.sh

      - name: Negative control — rehearsal must FAIL on a broken WHERE
        if: matrix.group == 'deletion'
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/deletion-deidentify-negative-control.sh

      - name: Flag-on lifecycle e2e (request -> cron -> anonymize; recover/cancel -> restored)
        if: matrix.group == 'deletion'
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/deletion-lifecycle-e2e.sh

      - name: Negative control — schema-proof must FAIL on missing column
        if: matrix.group == 'deletion'
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/tutor-schema-proof-negative-control.sh

      # Red-before/green-after on a seeded pre-state, plus the portability case that
      # regression-tests the hardcoded-count blocker (a migration carrying a prod row
      # count reds every fresh apply).
      - name: Mastery unblock migration gates (1.1 + 1.2)
        if: matrix.group == 'calendar-migrations'
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/mastery-unblock-gates.sh

      # Every file under scripts/prod-verify/ is pasted by hand into the Supabase
      # SQL editor and run against production — it is NOT run with `psql -f`.
      # This executes each one the way the operator does. Every prod-verify file
      # shipped in #589..#595 failed at its first backslash meta-command and CI
      # never noticed, because CI only ever ran the CI fixtures.
      - name: prod-verify console gate (operator SQL must run in a SQL console)
        if: matrix.group == 'calendar-migrations'
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/prod-verify-console-gate.sh

      # Guards the two read-only files that decide whether a history repair is safe
      # (ruling Q9 puts the repair itself in the Supabase CLI's hands). Parity runs
      # FIRST and must be strict: it is the only thing between a hand-applied schema
      # and an irreversible "recorded as applied".
      - name: Migration history gate
        if: matrix.group == 'calendar-migrations'
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/migration-history-gate.sh

      - name: Migration inventory gate (applied vs pending discrimination)
        if: matrix.group == 'calendar-migrations'
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/migration-inventory-gate.sh

      # Karl, 2026-10-21: I0 (no new duplicate migration versions) and its frozen list are
      # planted and must turn their named test red. No Postgres: I0 stops the gate first.
      - name: Migration duplicate-version mutations (planted defects must fail)
        if: matrix.group == 'calendar-migrations'
        run: bash scripts/ci/migration-duplicate-version.mutations.sh

      # Proves the gate above can fail, and fails on the assertion each mutation names.
      # M3 is the load-bearing one: without it "counted" and "excluded" are the same test.
      - name: KPI quarantine gate — mutation proof
        if: matrix.group == 'calendar-migrations'
        run: bash scripts/ci/05b-kpi-quarantine-gate.mutations.sh
        shell: bash

      # ── pg17 (port 5433): calendar ────────────────────────────────────────────────

      - name: Apply the migration pipeline to a throwaway database
        if: matrix.group == 'calendar-migrations'
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE calendar_parity;" >/dev/null
          # Supabase-provided roles and auth schema; a plain Postgres has neither.
          psql -v ON_ERROR_STOP=1 -d calendar_parity -q >/dev/null <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='anon')          THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='service_role')  THEN CREATE ROLE service_role NOLOGIN; END IF;
          END $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY, email text, raw_user_meta_data jsonb);
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $f$ SELECT NULL::uuid $f$;
          SQL
          # Same sorted order scripts/ci/genesis-fresh-apply.sh uses, so the schema
          # under test is the one the pipeline produces.
          for f in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -d calendar_parity -q -f "$f" >/dev/null
          done

      # Plants a repeat schedule, a readable future day, two pre-submit answer leaks and an early
      # archive page; each must turn its guarding check red on a named assertion (plan Q1-Q3).
      - name: QOTD mutations (planted defects must fail)
        if: matrix.group == 'qotd'
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ci/qotd.mutations.sh

      # Worked examples (Karl, 2026-10-27): one plant per rule (the leak rule both ways, steps,
      # one a day, RLS and grants, metric bounds; hook rules H1-H5, 30-60 s, safe area, blank
      # paper, audio mix, licence file, approval, post_on today, once, title, caption, plan
      # rotation, stale voice, Slack order). Each must turn its named check red.
      - name: Worked-example mutations (planted defects must fail)
        if: matrix.group == 'qotd'
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ci/worked-examples.mutations.sh

      # Growth report (Karl, 2026-10-28): under-13, guardian, deleted or internal accounts
      # counted, the week cut at UTC midnight, the current week reported, skips counted as
      # answers, study time uncapped, a wider 24-hour window, returning without the week before,
      # an upgrade outside the week, a ledger that posts twice, a client role that can run it, a
      # failed post keeping its claim, a percentage of zero, the route open without the secret.
      # Each must turn its named check red.
      - name: Growth report mutations (planted defects must fail)
        if: matrix.group == 'qotd'
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ci/growth-report.mutations.sh

      # Social funnel (Karl, 2026-10-28): a free-text tag past the allowlist, the server trusting
      # the browser, tags stored before consent, the cohort line ending early, /start losing
      # noindex, a "free study plan" claim, the sign-up link dropping its tag, a rewritable
      # signup_channel. Each must turn its named check red.
      - name: Social funnel mutations (planted defects must fail)
        if: matrix.group == 'qotd'
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ci/social-funnel.mutations.sh

      # LISA curriculum retrieval store (SCL-231, approved by Karl 2026-10-15): plants a dropped skill filter, a
      # dropped status filter, the bare ORDER BY/LIMIT form that comes back short under HNSW, a
      # reversed tie-break, a removed review CHECK, an empty-array-passing CHECK and a re-ingest
      # that keeps a stale approval. Each must turn its named gate red.
      - name: LISA curriculum_chunks mutations (planted defects must fail)
        if: matrix.group == 'qotd'
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ci/curriculum-chunks.mutations.sh

      # SEO Wave 2, plans Q5/Q6: plants the opt-in reset bug, under-13 opt-ins at every layer, a
      # lost consent source, a withdrawal emitting consent_captured, a non-atomic prompt claim,
      # a per-click dismissal, a lost deletion cascade, each cadence rule, Trustpilot for a minor
      # or without its URL, a prompt on the practice runner, feedback text in a log and the
      # onboarding checkbox for an under-13. Each must turn its guarding test red on a name.
      - name: Marketing opt-in + reviews mutations (planted defects must fail)
        if: matrix.group == 'review-marketing'
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ci/marketing-consent-reviews.mutations.sh

      # Lifecycle emails (Karl, 2026-10-21; SCL-239, SCL-240): plants the founding reminder and
      # the three behaviour triggers off their thresholds, cutovers and windows; for an entitled,
      # under-13, deleted, deletion-pending, guardian or denylisted student; twice; during quiet
      # hours; past the cap or out of priority order; without the self-cancel; with a message row;
      # kept after a refused send; open to authenticated; missing from the sweep; or logging an
      # address. Each must turn its guarding test red on a name.
      - name: Lifecycle email mutations (planted defects must fail)
        if: matrix.group == 'review-marketing'
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ci/lifecycle-email.mutations.sh

      # Smart landing (Karl, 2026-10-26): plants the arm ignoring the window, a free student or a
      # Pro student without a plan offered the wrong arms, dashboard off 1/3, eligibility re-read
      # mid-window, every open of the day landing, resume skipped, a deep link (hash or next)
      # treated as a default entry, guardians, admins, unknown age or a switched-off rotation
      # assigned, the switch shipped ON, a set without its easy/medium lead or 5+5 order, a
      # fallback unrecorded, "5 more" after any landing, a launch without the entitlement, an
      # event without its listed properties, a free-form device class or body, escape beyond 30 s
      # or on dashboard, the summary unbounded or repeated, the cron moved, no deletion cascade,
      # authenticated grants, and a landing runner's back link not reaching Home. Each must turn
      # its guarding test red on a name.
      - name: Smart landing mutations (planted defects must fail)
        if: matrix.group == 'review-marketing'
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ci/smart-landing.mutations.sh

      # Sign-up channel (Karl, 2026-10-28): plants a lost source mapping, any campaign kept, the
      # first touch losing to the sign-up page, the link into sign-up not carrying it, storage on
      # the device, the Google path not sending or recording it, an onboarded account written,
      # set-once and the under-13 clear removed in the database, and free text in the campaign.
      # Each must turn its guarding test red by name.
      - name: Sign-up attribution mutations (planted defects must fail)
        if: matrix.group == 'review-marketing'
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ci/signup-attribution.mutations.sh

      # SCL-222 sign-in notice: plants a returning user's Google sign-in recording acceptance, the
      # new-account test ignoring the account's age, email signup recording only on a client
      # consent claim, and a disabled Continue with Google. Each must turn its test red by name.
      - name: Sign-in notice mutations (planted defects must fail)
        if: matrix.group == 'qotd'
        run: bash scripts/ci/signin-notice.mutations.sh

      # Live bug 2026-10-11 (passages printed their <u> tags): plants the tags printed again
      # (MathRenderer, StaticMath), the underline dropped (MathRenderer, exam passage view), the
      # allowlist widened to <U>, the missing-target and raw-HTML rules switched off, the
      # baseline ratchet loosened, and the assembly gate unwired. Each must turn its test red.
      - name: Question underline mutations (planted defects must fail)
        if: matrix.group == 'qotd'
        run: bash scripts/ci/question-underline.mutations.sh

      # Sender name per email type and the QOTD subject/preview (Karl, 2026-10-14): plants the bare
      # From, a wrong category, no fallback, no sanitizing, the subject prefix, the streak
      # threshold, the dropped preheader, an answer leak through the row projection, and a send
      # without an address. Each must turn its test red.
      - name: Email sender-name mutations (planted defects must fail)
        if: matrix.group == 'qotd'
        run: bash scripts/ci/email-sender-names.mutations.sh

      # Doc 10B Phase 1 (blog pipeline): plants an unapproved or future post going public, the
      # withheld post's words reaching the bundle, a daily rebuild, a merge by anyone stamping the
      # approval, a ready batch without Codex's verdicts or Claude's responses, and each new
      # quality gate (gate 11 duplicates, AI mentions, the LISA exception, the trademark notice,
      # internal labels, the practice/score link, Vale's ai-tells, lychee's 404). Each must turn
      # its named test red.
      - name: Install content tools (Vale, lychee — pinned, sha256-checked)
        if: matrix.group == 'review-marketing'
        uses: ./.github/actions/content-tools

      - name: Content pipeline mutations (planted defects must fail)
        if: matrix.group == 'review-marketing'
        run: bash scripts/ci/content-ops.mutations.sh

      # Marketing email lane (contract §14): plants the age rule and the pending-deletion
      # exclusion out of the audience, a lost replay dedupe, a complaint logged as an
      # unsubscribe, a provider grant, a signature bypass, ignored unsubscribes / complaints,
      # deletion without bringing the unsubscribe back, a kept opt-out, the wrong segment, acting
      # on a partial read, an address in a log and account deletion keeping the contact. Each
      # must turn its test red by name.
      - name: Marketing email lane mutations (planted defects must fail)
        if: matrix.group == 'review-marketing'
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ci/marketing-email-sync.mutations.sh

      # Owner brief "Question of the Day on Home" (2026-10-08/09): each locked rule (one per
      # Chicago day, replay, quota exclusion, streak sources, prompt rules, 17:00 across DST,
      # sunset, signed unsubscribe, SAT dates) is planted and must turn its named test red.
      - name: Home QOTD, streak, email and SAT dates mutations (planted defects must fail)
        if: matrix.group == 'qotd'
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ci/home-qotd.mutations.sh

      # Owner brief "Getting started checklist + onboarding update" (final brief v2, Karl,
      # 2026-10-13): every rule (step data, "Not sure yet", sticky, plan and eligibility, dismiss,
      # students only, Home order, Practice row, onboarding and Settings score, the rename) is
      # planted and must turn its named test red.
      - name: Getting started checklist mutations (planted defects must fail)
        if: matrix.group == 'qotd'
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ci/getting-started.mutations.sh

      # Server-side funnel events (Karl, 2026-10-21): every rule (once per student, exact
      # properties incl. a forbidden-property plant, the salted distinct id, fire-and-forget,
      # under-13 exclusion, analytics off, the onboarding delay, QOTD vs practice, alpha = 100% off,
      # service_role grants, the backfill, and each route hook) is planted and must turn its named
      # test red.
      - name: Server-side funnel events mutations (planted defects must fail)
        if: matrix.group == 'qotd'
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ci/funnel-events.mutations.sh

      # QOTD resilience (Karl, 2026-10-09): every alert rule (horizon < 7, once per condition per
      # day, one recovery, the independent check, channel independence, one unset-webhook warning),
      # the no-question skip, the summary line, no address in logs, and both collapsed cards are
      # planted and must turn their named test red.
      - name: QOTD resilience mutations (planted defects must fail)
        if: matrix.group == 'qotd'
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ci/qotd-resilience.mutations.sh

      # Chicago-time schedules (Karl, 2026-10-09, SCL-227): the pinned cron times, quiet-hours
      # deferral to 08:00 Chicago on both sides of DST, the user-triggered exemption, expiry
      # (exam reminder, qotd_daily), the QOTD-only 17:00 run and the week-notice-after-re-plan
      # rule are planted (Q1-Q17) and must turn their named test red.
      - name: Notification quiet hours and expiry mutations (planted defects must fail)
        if: matrix.group == 'qotd'
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ci/notification-quiet-hours.mutations.sh

      # A gate that has stopped biting is indistinguishable from a passing one, so the
      # placement gates are planted rather than trusted. Each case builds its own
      # throwaway database, because the pipeline is not idempotent.
      - name: Calendar placement gates — mutations (Z-70 and the override arms)
        if: matrix.group == 'calendar-migrations'
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ci/calendar-placement-gate.mutations.sh

      - name: Parity vs calendar_formula_reference.py (13 fixtures + seeded 3000 suite)
        if: matrix.group == 'calendar-migrations'
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: calendar_parity
          CALENDAR_PARITY_REQUIRE_PG_MAJOR: "17"
        run: pnpm exec tsx scripts/ci/calendar-parity.ts --suite-n 3000 --suite-seed 1

      # Every fixture carried an `exam_placement` block and nothing read it, so the
      # suppression rule had no gate of any kind. It does now, and these plants are what
      # say so: two on the stored block, one on the database's own return.
      - name: Parity exam_placement comparison — mutations
        if: matrix.group == 'calendar-migrations'
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: calendar_parity
          CALENDAR_PARITY_REQUIRE_PG_MAJOR: "17"
        run: bash scripts/ci/calendar-parity-placement.mutations.sh

      # ── Last: the PostgREST mutation harness (BYPASSRLS on service_role is cluster-wide) ──

      # Proves the proof can fail, and that each mutation reds the assertion it names.
      # M1 and M3 both attack case 1 and are kept apart by WHICH line they red.
      - name: Mastery emission → REAL PostgREST proof — mutation harness
        if: matrix.group == 'calendar-migrations'
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/mastery-postgrest-gate.mutations.sh

  browser:
    runs-on: ubuntu-latest
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium (the build @playwright/test pins)
        run: pnpm exec playwright install --with-deps chromium

      # A placeholder Desmos key so the calculator path is in the bundle; the page-CSP spec answers
      # www.desmos.com's calculator.js with a stand-in (E2E_DESMOS_STUB), as CI holds no key.
      - name: Build (with a dummy PostHog key so the SDK path is in the bundle)
        env:
          VITE_SUPABASE_URL: http://localhost:9
          VITE_SUPABASE_ANON_KEY: ci
          VITE_POSTHOG_KEY: phc_e2e_dummy_key_not_a_project
          VITE_DESMOS_API_KEY: ci-desmos-stub-key
        run: pnpm run build

      - name: Serve dist/public with vercel.json's headers
        run: |
          set -euo pipefail
          nohup node scripts/ops/page-csp-static-server.mjs 5175 > "$RUNNER_TEMP/static.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:5175/; then echo "static server up after ${i}s"; exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/static.log"
          exit 1

      #  - INV-10A-17: every student flow under the page CSP, zero violation reports.
      - name: Page CSP, every student flow (INV-10A-17)
        env:
          E2E_BASE_URL: http://127.0.0.1:5175
          E2E_DESMOS_STUB: "1"
        run: |
          set -euo pipefail
          pnpm exec playwright test tests/e2e/page-csp-flows.spec.ts --forbid-only --reporter=list

      - name: Start the client (Vite; the specs answer every /api call themselves)
        run: |
          set -euo pipefail
          VITE_SUPABASE_URL=http://localhost:9 VITE_SUPABASE_ANON_KEY=ci \
            nohup pnpm exec vite --port 5173 --strictPort > "$RUNNER_TEMP/vite.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://localhost:5173/; then echo "Vite up after ${i}s"; exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/vite.log"
          exit 1

      - name: Guardian browser specs (R12 16px floor, phone centring, meter width)
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_SHOT_DIR: ${{ runner.temp }}/guardian-shots
        run: |
          set -euo pipefail
          pnpm exec playwright test \
            tests/e2e/guardian-surfaces.spec.ts \
            tests/e2e/student-calendar.spec.ts \
            --forbid-only --reporter=list

  # The LISA chat dock's browser spec (owner ruling on #1300, Karl, 2026-10-23: "Add the dock's
  # browser tests to CI"). It drives a production build against the student harness (the real
  # routers over a database built from supabase/migrations), so it needs Postgres, provisioned as
  # the nightly exam e2e job does (pgvector image: genesis declares the `vector` extension). The
  # harness start lives in tests/e2e/run-lisa-dock-e2e.sh (harness paths stay inside tests/).
  # Runs wherever the full tier runs: every pull request into main, a pull request into cleanup
  # with the ci:full label, pushes to main and manual dispatch (see `scope`).
  lisa-dock-browser:
    runs-on: ubuntu-latest
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16   # the harness's own local major; genesis declares `vector`
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No version pin here: pnpm version is derived from package.json
        # "packageManager" — single source of truth (Q2).

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium (the build @playwright/test pins)
        run: pnpm exec playwright install --with-deps chromium

      - name: LISA chat dock browser spec (student harness, lisa-dock seed)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          LOG_DIR: ${{ runner.temp }}
        run: bash tests/e2e/run-lisa-dock-e2e.sh

  # Smart landing in a real browser (Karl, 2026-10-26, item 4), with its planted defect: the same
  # job ci.yml runs when the `smart_landing` path group changes, here on every full-tier run.
  smart-landing-browser:
    runs-on: ubuntu-latest
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16   # the harness's own local major; genesis declares `vector`
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium (the build @playwright/test pins)
        run: pnpm exec playwright install --with-deps chromium

      - name: Smart landing browser spec, then the planted defect (today's bug) must turn it red
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          LOG_DIR: ${{ runner.temp }}
        run: bash scripts/ci/smart-landing-e2e.mutations.sh

  # The required check. Green only when the full tier passed on this exact tree.
  ci-full:
    runs-on: ubuntu-latest
    needs: [scope, review-ui-gate, gate-selftests, pg-mutations, browser, lisa-dock-browser, smart-landing-browser]
    if: ${{ always() }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verdict
        env:
          RUN: ${{ needs.scope.outputs.run }}
          SATISFIED: ${{ needs.scope.outputs.satisfied }}
          REQUIRED: ${{ needs.scope.outputs.required }}
          RESULTS: ${{ needs.review-ui-gate.result }} ${{ needs.gate-selftests.result }} ${{ needs.pg-mutations.result }} ${{ needs.browser.result }} ${{ needs.lisa-dock-browser.result }} ${{ needs.smart-landing-browser.result }}
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: bash scripts/ci/ci-full-verdict.sh

      - name: Record the tree the full tier passed
        if: ${{ needs.scope.outputs.run == 'true' }}
        run: echo "${{ needs.scope.outputs.tree }}" > tested-tree.txt

      - name: Upload the full-tier tree marker
        if: ${{ needs.scope.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-full-tested-tree-${{ needs.scope.outputs.tree }}
          path: tested-tree.txt
          retention-days: 30

      # The label means "run the full tier on this head". Once this tree is covered, it is spent:
      # by this run, or by an earlier one (a label added while a run was in progress waits for it,
      # then finds the tree satisfied). A later push needs a fresh label, so the full tier always
      # covers the head being merged. (A pull request into `main` needs no label; one left on it
      # is removed the same way.)
      - name: Spend the ci:full label
        if: ${{ always() && github.event_name == 'pull_request' && (needs.scope.outputs.run == 'true' || needs.scope.outputs.satisfied == 'true') && contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "${{ github.repository }}" --remove-label ci:full || echo "::warning::could not remove the ci:full label"
