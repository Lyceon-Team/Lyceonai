# Voice A (Chirp 3 HD Orus) lines: a single run, as a job on its own pull request (the bake-off
# pattern, Karl's step-1 rulings 2026-11-11 option (b); Karl's voice change 2026-11-11). Through
# lyceon-ci-eval (Workload Identity Federation, no stored key) it voices the three "Lyceon SAT
# Prep." pronunciation clips, every W47 line and today's (Nov 11) example in voice A, and uploads
# the raw audio as an artifact. Nothing is normalised, committed or posted here: the checks and the
# renders run locally on the downloaded audio. No schedule; removed once voice A is rolled out.
name: Voice A lines

on:
  pull_request:
    paths:
      - .github/workflows/voice-a-lines.yml
      - scripts/worked-examples/chirp-lines.ts

permissions:
  contents: read

concurrency:
  group: voice-a-lines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout (code)
        uses: actions/checkout@v4

      - name: Checkout W47 and the Nov 11 example (content, with the no-"Go" hooks)
        uses: actions/checkout@v4
        with:
          ref: claude/worked-examples-w47
          path: w47
          sparse-checkout: |
            content/worked-examples/2026-W47
            content/worked-examples/2026-W46/SATM2IF0OE0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/480325859530/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: lyceon-ci-eval@replit-cop.iam.gserviceaccount.com

      - name: Voice the clips, W47 and today's example in voice A
        env:
          OUT: ${{ runner.temp }}/voice-a
        run: |
          set -euo pipefail
          args=()
          for d in w47/content/worked-examples/2026-W47/*/; do args+=(--example "$d"); done
          pnpm exec tsx scripts/worked-examples/chirp-lines.ts --voice Orus --out "$OUT" --clips \
            "${args[@]}" --example w47/content/worked-examples/2026-W46/SATM2IF0OE0

      - name: Upload the lines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-a-lines
          path: ${{ runner.temp }}/voice-a
          if-no-files-found: ignore
          retention-days: 7
