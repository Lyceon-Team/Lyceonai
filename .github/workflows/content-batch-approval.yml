# Records Karl's approval of a content cycle from the merge of its batch pull request.
#
# @spec [docs/Spec/Lyceon_Doc_10B.md §2.4 ("Karl's approval is a merge of the batch pull request"),
#   §8.7 ("Triggers never merge"); owner answer on Doc 10B Phase 1 Step 0, item 1 (Karl,
#   2026-10-11): "merge alone counts … a plain workflow script stamps the approval from the merge
#   event … No extra click."; owner brief 2026-10-11, "change how the approval is recorded so it
#   doesn't need a direct push to a protected branch"] | @implemented [2026-10-11]
#
# plain English: Karl's merge of a batch pull request into `social` is the approval. That merge is
# a push to `social`; this job runs on it, asks GitHub which pull request the pushed commit merged
# (GitHub's record, not anything in the pull request), and, when the merger is the approver
# (repository variable CONTENT_APPROVER_LOGIN) and the merge commit is exactly the pushed commit,
# commits the cycle's stamp to content/batches/approvals.json on `social`. The site treats a post as
# approved exactly when its cycle has a stamp (shared/content/approvals.ts).
#
# WHY A GITHUB APP TOKEN. `social` is protected by a ruleset, and the GITHUB_TOKEN cannot be a
# bypass actor, so it cannot push the stamp once a required check is on. A GitHub App can be
# bypass-listed: this is GitHub's documented pattern for a workflow that writes to a protected
# branch. The token is minted per run (one hour, this repository, contents: write).
#
# WHY A PUSH TRIGGER AND AN ENVIRONMENT. The App's private key lives only in the `content-approval`
# Environment, whose deployment branch rule allows `social` alone. A job may use it only when it
# runs on `refs/heads/social`, i.e. on a push to `social`: no pull request, no other branch and no
# other workflow can read the key. (A pull_request trigger runs on refs/pull/N/merge, which that rule
# would refuse.)
#
# Loop and fail-closed: the stamp commit is itself a push to `social`; GitHub reports no merged pull
# request behind it, so that run stamps nothing. Any failure (no App, no bypass, wrong merger)
# leaves the run red and the cycle unapproved: nothing publishes without the stamp.
# Setup: docs/runbooks/content-ops.md §2.
name: Content batch approval

on:
  push:
    branches: [social]
    paths:
      - content/batches/**

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: content-batch-approval
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: content-approval
    steps:
      - name: Find the pull request this push merged (GitHub's record)
        id: pull
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          number="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
            --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"${SHA}\")][0].number // empty")"
          if [ -z "$number" ]; then
            echo "No pull request was merged by ${SHA}: nothing to stamp."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" > "$RUNNER_TEMP/pull.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}/files" --paginate --jq '.[].filename' \
            > "$RUNNER_TEMP/files.txt"

      - name: Mint the approval App token
        if: steps.pull.outputs.number != ''
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CONTENT_APP_ID }}
          private-key: ${{ secrets.CONTENT_APP_PRIVATE_KEY }}

      - name: Checkout social (as the App)
        if: steps.pull.outputs.number != ''
        uses: actions/checkout@v4
        with:
          ref: social
          token: ${{ steps.app.outputs.token }}

      - name: Setup pnpm
        if: steps.pull.outputs.number != ''
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.pull.outputs.number != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.pull.outputs.number != ''
        run: pnpm install --frozen-lockfile

      - name: Stamp the approval
        if: steps.pull.outputs.number != ''
        env:
          STAMP_PUSH_SHA: ${{ github.sha }}
          CONTENT_APPROVER_LOGIN: ${{ vars.CONTENT_APPROVER_LOGIN }}
        run: |
          STAMP_PULL_JSON="$(cat "$RUNNER_TEMP/pull.json")"
          STAMP_CHANGED_FILES="$(cat "$RUNNER_TEMP/files.txt")"
          export STAMP_PULL_JSON STAMP_CHANGED_FILES
          pnpm exec tsx scripts/content/stamp-approval.ts

      - name: Commit the stamp to social (as the App, which the ruleset bypass-lists)
        if: steps.pull.outputs.number != ''
        run: |
          if git diff --quiet -- content/batches/approvals.json; then
            echo "No new stamp."
            exit 0
          fi
          git config user.name "lyceon-content-approval[bot]"
          git config user.email "lyceon-content-approval[bot]@users.noreply.github.com"
          git add content/batches/approvals.json
          git commit -m "content: record Karl's approval from PR #${{ steps.pull.outputs.number }}"
          for i in 1 2 3 4; do
            git pull --rebase origin social && git push origin HEAD:social && exit 0
            sleep $((2 ** i))
          done
          echo "Could not push the approval stamp to social." >&2
          exit 1
