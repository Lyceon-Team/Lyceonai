# Records Karl's approval of a content cycle from the merge of its batch pull request.
#
# @spec [docs/Spec/Lyceon_Doc_10B.md §2.4 ("Karl's approval is a merge of the batch pull request"),
#   §8.7 ("Triggers never merge"); owner answer on Doc 10B Phase 1 Step 0, item 1 (Karl,
#   2026-10-11): "merge alone counts … a plain workflow script stamps the approval from the merge
#   event … No extra click."; Karl's ruling (2026-10-11, restated 2026-10-15): no GitHub App, the
#   workflow's own token pushes the stamp, and a dispatch input stamps a past merge]
#   | @implemented [2026-10-11; workflow token and dispatch 2026-10-15]
#
# plain English: Karl's merge of a batch pull request into `social` is the approval. That merge is
# a push to `social`; this job runs on it, asks GitHub which pull request the pushed commit merged
# (GitHub's record, not anything in the pull request), and, when the merger is the approver
# (repository variable CONTENT_APPROVER_LOGIN) and the merge commit is exactly the pushed commit,
# commits the cycle's stamp to content/batches/approvals.json on `social`. The site treats a post as
# approved exactly when its cycle has a stamp (shared/content/approvals.ts).
#
# WHY THE WORKFLOW TOKEN. Karl's ruling: the `social` ruleset blocks only deletion and force
# pushes, so the job's own GITHUB_TOKEN (contents: write) can push the stamp. No App, no key, no
# Environment. If a required check or a pull-request rule is ever added to `social`, this token can
# no longer push there: a GitHub App on the ruleset's bypass list is the upgrade path then.
#
# A PAST MERGE (workflow_dispatch). A merge whose stamp run failed (e.g. #1240, before this change)
# is stamped by hand from the Actions tab: "Run workflow" on branch `social` with `pr_number`. The
# same rules apply, with one change: the merge commit must be ON `social` (an ancestor of its head)
# instead of being the pushed commit. A dispatch that cannot stamp fails the run, so a typo is red.
#
# Loop and fail-closed: a push made with GITHUB_TOKEN starts no workflow run, and the stamp commit
# merged no pull request anyway. Any failure (wrong merger, merge not on `social`, push refused)
# leaves the run red and the cycle unapproved: nothing publishes without the stamp.
# Setup: docs/runbooks/content-ops.md §2.
name: Content batch approval

on:
  push:
    branches: [social]
    paths:
      - content/batches/**
  workflow_dispatch:
    inputs:
      pr_number:
        description: "A batch pull request already merged into social, e.g. 1240"
        required: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: content-batch-approval
  cancel-in-progress: false

jobs:
  stamp:
    # A dispatch from any other branch would check out and push to social all the same; refuse it.
    if: github.ref == 'refs/heads/social'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout social
        uses: actions/checkout@v4
        with:
          ref: social
          fetch-depth: 0

      - name: Find the pull request this push merged (GitHub's record)
        if: github.event_name == 'push'
        id: pushed
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          number="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
            --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"${SHA}\")][0].number // empty")"
          if [ -z "$number" ]; then
            echo "No pull request was merged by ${SHA}: nothing to stamp."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" > "$RUNNER_TEMP/pull.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}/files" --paginate --jq '.[].filename' \
            > "$RUNNER_TEMP/files.txt"

      - name: Find the pull request named by the dispatch (GitHub's record)
        if: github.event_name == 'workflow_dispatch'
        id: dispatched
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,6}$ ]]; then
            echo "pr_number must be a pull request number, e.g. 1240" >&2
            exit 1
          fi
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/pull.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename' \
            > "$RUNNER_TEMP/files.txt"
          merge_sha="$(jq -r '.merge_commit_sha // empty' "$RUNNER_TEMP/pull.json")"
          if [ -n "$merge_sha" ] && git merge-base --is-ancestor "$merge_sha" HEAD 2>/dev/null; then
            echo "on_branch=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_branch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.pushed.outputs.number != '' || steps.dispatched.outputs.number != ''
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.pushed.outputs.number != '' || steps.dispatched.outputs.number != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.pushed.outputs.number != '' || steps.dispatched.outputs.number != ''
        run: pnpm install --frozen-lockfile

      - name: Stamp the approval
        if: steps.pushed.outputs.number != '' || steps.dispatched.outputs.number != ''
        env:
          STAMP_PUSH_SHA: ${{ github.sha }}
          STAMP_DISPATCH_PR: ${{ steps.dispatched.outputs.number }}
          STAMP_MERGE_ON_BRANCH: ${{ steps.dispatched.outputs.on_branch }}
          CONTENT_APPROVER_LOGIN: ${{ vars.CONTENT_APPROVER_LOGIN }}
        run: |
          STAMP_PULL_JSON="$(cat "$RUNNER_TEMP/pull.json")"
          STAMP_CHANGED_FILES="$(cat "$RUNNER_TEMP/files.txt")"
          export STAMP_PULL_JSON STAMP_CHANGED_FILES
          pnpm exec tsx scripts/content/stamp-approval.ts

      - name: Commit the stamp to social (with the workflow token)
        if: steps.pushed.outputs.number != '' || steps.dispatched.outputs.number != ''
        env:
          PR_NUMBER: ${{ steps.pushed.outputs.number || steps.dispatched.outputs.number }}
        run: |
          if git diff --quiet -- content/batches/approvals.json; then
            echo "No new stamp."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/batches/approvals.json
          git commit -m "content: record Karl's approval from PR #${PR_NUMBER}"
          for i in 1 2 3 4; do
            git pull --rebase origin social && git push origin HEAD:social && exit 0
            sleep $((2 ** i))
          done
          echo "Could not push the approval stamp to social." >&2
          exit 1
