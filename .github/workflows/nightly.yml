# NIGHTLY (owner decisions 2026-10-07 on the CI audit, items 2 and 6). Checks of external drift
# that must not turn an unrelated pull request red, and the slow browser specs no other job runs.
# Runs against `main` every night; a failure here is fixed on its own branch.
name: Nightly

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily
  workflow_dispatch:

env:
  CI: true

jobs:
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No version pin here: pnpm version is derived from package.json
        # "packageManager" — single source of truth (Q2).

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The accepted "TypeScript Check (CI tsconfig)" step that stood here was retired on
      # 2026-09-30 per its own re-arm condition (ci/known-gaps.yaml, typecheck-ci-tsconfig: "Delete
      # this entry and drop continue-on-error once `pnpm exec tsc -p tsconfig.ci.json` exits 0").
      # Both it and `pnpm run check` exit 0; the blocking "TypeScript check — whole app" step in the
      # `ci` job covers every file it did.

      # PROMOTED TO BLOCKING 2026-08-19. Measured before promoting: `pnpm run
      # audit:ci` reports ZERO advisories of any severity, so the
      # continue-on-error was suppressing nothing at all — it only guaranteed
      # that the first real high/critical advisory would land silently. There is
      # no accept-list entry for this because there is nothing to accept.
      - name: Security Audit (high/critical) — blocking
        run: |
          pnpm run audit:ci
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('audit-output.json','utf8'));
            const v = data?.vulnerabilities || {};
            const bad = Object.values(v).some(x => ['high','critical'].includes(String(x?.severity || '').toLowerCase()));
            if (bad) { console.error('High/Critical vulnerabilities found.'); process.exit(1); }
            console.log('No High/Critical vulnerabilities found.');
          "

  # Workload Identity Federation still exchanges a token (GCP pool and IAM config drift). No job
  # depends on it, so it does not need to run, and mint an OIDC token, on every pull request.
  gcp-wif-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/480325859530/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: lyceon-ci-eval@replit-cop.iam.gserviceaccount.com

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify GCP auth (one command proof)
        run: gcloud auth list

  # The exam and calendar browser specs (owner decision 2026-10-07, CI audit item 6). They had run
  # in no job. The REAL client (Vite dev) against the E7b exam harness: the real /api/tests,
  # /api/calendar, /api/students and /api/guardian routers over a database built from
  # supabase/migrations, auth stubbed to one student, one fresh database per spec. The harness is
  # started by tests/e2e/run-exam-calendar-e2e.sh: the harness isolation gate (I1) fails on any
  # file outside tests/ that names the harness, this one included. No secrets: Desmos is answered
  # by the shared stand-in (E2E_DESMOS_STUB), so the real Desmos runtime (G-EX-08) is NOT proven
  # here.
  exam-calendar-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg17   # prod major; genesis declares the `vector` extension
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium (the build @playwright/test pins)
        run: pnpm exec playwright install --with-deps chromium

      # Vite proxies /api to localhost:$PORT (vite.config.ts); the harness listens on 5055. A
      # placeholder Desmos key puts the calculator path in the bundle; the specs answer
      # calculator.js with the stand-in (E2E_DESMOS_STUB=1).
      - name: Start the client (Vite, /api proxied to the harness on :5055)
        run: |
          set -euo pipefail
          PORT=5055 VITE_SUPABASE_URL=http://localhost:9 VITE_SUPABASE_ANON_KEY=ci \
            VITE_DESMOS_API_KEY=ci-desmos-stub-key \
            nohup pnpm exec vite --port 5173 --strictPort > "$RUNNER_TEMP/vite.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null http://localhost:5173/; then echo "Vite up after ${i}s"; exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/vite.log"
          exit 1

      - name: Exam + calendar browser specs (exam-shell, exam-desmos, exam-disclosure, calendar-full-length)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          HARNESS_PORT: "5055"
          E2E_BASE_URL: http://localhost:5173
          E2E_DESMOS_STUB: "1"
          E2E_SHOT_DIR: ${{ runner.temp }}/exam-shots
        run: bash tests/e2e/run-exam-calendar-e2e.sh
