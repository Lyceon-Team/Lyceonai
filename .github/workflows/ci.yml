      # @spec [owner instruction 2026-08-28 Task 1 Gates A and B] | @implemented [2026-09-01]
      #
      # The three files converted off mocked query layers and hand-written row fixtures on
      # 2026-09-01, added here by hand per the NOTE above — which is the whole reason that
      # note exists. Without this step they run in NO job: the whole-suite `pnpm test` step
