        shell: bash

      # The 2026-06-26 outage, reproduced as a permanent test: a corrupt row in one
      # section must not abort a valid mastery write in another. SCL-054 / INV-05B-16.
      - name: KPI quarantine gate (blast radius; excluded_event_count)
