      # @spec [Doc-01_V8 §5 / §5.1 / App A.5 / App E; SCL-085 / SCL-087 (PROPOSED); SCL-090
      #        (PROPOSED as ruled 2026-09-17); owner brief 2026-09-17 "Deletion Vertical: Phases
      #        2, 3, 5" and its follow-up "Replace Bespoke Suppression With Resend's"]
      #        | @implemented [2026-09-17]
      # Phases 2/3/5: the audit_logs guard refuses UPDATE/DELETE for service_role and the single
      # exempt function is the only body that may open the gate; the three deletion actions are
      # written, with profile_hard_deleted proven to share no transaction with the pseudonymous
