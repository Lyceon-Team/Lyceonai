name: CI

on:
  pull_request:
  push:
    branches: [main, cleanup]

# CI runs without secrets by default (for forks and basic validation).
# Secrets are only required for integration tests, which are skipped here.
env:
  CI: true

jobs:
  # ---------------------------------------------------------------------------
  # Required gate. Every step here is verified GREEN against the current tree
  # (Pass 0, 2026-06-03). Node version comes from .nvmrc (single source of
  # truth shared with local dev); pnpm matches the version used to verify.
  # ---------------------------------------------------------------------------
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No version pin here: pnpm version is derived from package.json
        # "packageManager" (pnpm@10.33.0) — single source of truth (Q2).

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Route Registry
        run: pnpm run route:validate

      - name: Run Security Tests (IDOR + entitlements regression)
        run: pnpm run test:security

      # Full deterministic CI suite. The stale-mock contract files were deleted
      # in Pass 0 (clean delete + rebuild later — see docs/alignment/KNOWN-GAPS.md),
      # so this runs green with no exclusions.
      # WHOLE SUITE, BLOCKING. This step used to run `test:ci` = `vitest run
      # tests/ci`, a fraction of the repo's tests. The rest were reported for
      # weeks as "pre-existing, gated" while running in no job at all — path
      # scope is a worse suppression than an accept-list, because it leaves no
      # record and the files still read as coverage.
      #
      # EXACT ARITHMETIC, re-measured at this head (the earlier comment said
      # 182/170 and was stale by one file after the dead test was deleted):
      #
      #   181 tracked *.{test,spec}.{ts,tsx}
      #   = 169 vitest-selected
      #   +   9 Playwright .spec.ts   — match no vitest `include`, run in NO job
      #   +   2 tests/integration/**  — excluded; the `integration` job owns them
      #   +   1 tests/auth.integration.test.ts — excluded as "moved to
      #                                  tests/integration/", but the original is
      #                                  still tracked. A stale duplicate.
      #
      # REPORT SELECTED AND PASSED SEPARATELY. A green run reads
      # `161 passed | 8 skipped (169)` — 169 selected, 161 passed, 8 skipped.
      # Quoting the passed count as though it were the selected count is how a
      # skip becomes invisible, which is the same class of error as counting a
      # file that never ran as coverage.
      #
      # Cost measured on the RUNNER, not locally: 17.3s -> 54.3s. The PR body
      # originally said +25s from local timing; the hosted figure is +37s. Still
      # well inside the budget for a job that was ~45s, so no fast/full split is
      # proposed — but the number quoted is the one from the machine that
      # actually gates merges.
      - name: Run Tests (whole suite — blocking)
        run: pnpm test

      # Wave 0 canonical primitives (@lyceon/shared): the new SSOT is born proven —
      # strict typecheck, its own tests, and lint at error level all BLOCKING.
      - name: Shared package — typecheck (blocking)
        run: pnpm run check:shared

      - name: Shared package — tests (blocking)
        run: pnpm run test:shared

      - name: Shared package — lint (blocking)
        run: pnpm run lint:shared

      - name: Build
        run: pnpm run build

      - name: Check No Test Routes in Dist
        run: node scripts/ci/check-no-test-routes-dist.mjs

      - name: No hardcoded constants (Lane-A gate — DB is source of truth)
        run: node scripts/ci/no-hardcoded-constants.mjs

      - name: Tutor never writes mastery (C-7 / INV-03-01)
        run: node scripts/ci/tutor-never-writes-mastery.mjs

      # SAT_TAXONOMY shipped slugs ('math', 'advanced_math', 'linear_equations')
      # against a database holding 'M', 'Advanced Math', 'Linear Equations in One
      # Variable'. Nothing joined and the mastery page said "No Mastery Data Yet" to
      # every student who had data. It survived because the TESTS seeded the same
      # slugs: the suite agreed with the broken code instead of with the schema.
      - name: Test fixture canonicality gate (section/domain must match the DB CHECKs)
        run: node scripts/ci/test-fixture-canonicality-gate.mjs

      - name: Fixture canonicality self-test (proves each mutation turns it red)
        run: bash scripts/ci/test-fixture-canonicality-gate.selftest.sh

      # Deleting a route removes the server half; a forgotten caller fails at RUNTIME as a
      # 404 the UI renders as an error state or an empty list. The path is a string, so tsc
      # cannot see it — only a text search over the committed tree can.
      - name: Retired endpoints gate (no caller of a deleted route may remain)
        run: node scripts/ci/retired-endpoints-gate.mjs

      - name: Retired endpoints self-test (proves each mutation turns it red)
        run: bash scripts/ci/retired-endpoints-gate.selftest.sh

      # "Every subject-scoped handler is role-blind" is an ALL-ROUTES property, and any
      # all-routes property is a chokepoint: enforced once, never per route. Three privilege
      # divergences in this vertical were each found by collapsing two independently-written
      # paths; while two paths serve one resource a fourth instance is a schedule, not a risk.
      - name: Subject-resolver chokepoint gate (no handler below the resolver learns the caller's role)
        run: node scripts/ci/subject-resolver-chokepoint-gate.mjs

      # practice_sessions.mode decides event_source_kind, so accepting it as free
      # text let a client classify its own activity in the mastery record AND
      # create a diagnostic session through the practice route, bypassing the
      # once-only guard. Integrity bypass, not a lifecycle bug.
      - name: Session-mode boundary gate (BUG-3 — client cannot name its own mode)
        run: node scripts/ci/session-mode-boundary-gate.mjs

      # The RULE is unit-tested in packages/shared; this covers the seam the unit
      # test cannot see — narrowing the route's status filter back to
      # ['created','active'] means the rule never receives the completed row and a
      # second diagnostic is startable again, with every unit test still green.
      - name: Diagnostic once-only gate (BUG-2 — no retake)
        run: node scripts/ci/diagnostic-once-only-gate.mjs

      # The diagnostic lifecycle is declared in three places that cannot import
      # from each other: the CASE arms in the migration, DIAGNOSTIC_STATES in
      # packages/shared, and the EstimateStatus union in the client (which has no
      # module path to packages/shared). A state the SQL emits and the TypeScript
      # cannot name degrades the student silently; a status the server emits and
      # the client cannot name renders a blank card, not a type error.
      - name: Diagnostic state drift gate (SQL <-> shared <-> client)
        run: node scripts/ci/diagnostic-state-drift-gate.mjs

      - name: Guards proven by planted violations (B-WS3-1 §E)
        run: bash scripts/ci/guards-selftest.sh

      - name: Practice schema-types gate (STRUCTURAL 1 — no phantom columns)
        run: bash scripts/ci/practice-schema-types-gate.sh

      - name: Wire-contract drift gate (AUD-519-007 — L1.4 single-contract)
        run: diff shared/tutor-orchestrator-wire.ts apps/workers/tutor-orchestrator/src/lib/_tutor-orchestrator-wire.generated.ts

      - name: Safety-constants drift gate (AUD-B1.1c-010 — anti-leak + boundary mirrors)
        run: diff shared/tutor-safety-constants.ts apps/workers/tutor-orchestrator/src/lib/_tutor-safety-constants.generated.ts

      # Mastery emission failed 100% of the time for seven weeks unnoticed. These two
      # gates block the two defects that made that invisible: console.* on mastery
      # paths, and a miscalled structured logger that put the data object into `event`
      # (which no log filter can match).
      - name: Mastery emission observability gate (M-05 / M-07)
        run: node scripts/ci/mastery-emission-observability.mjs

      # The destructive rehearsal scripts seed fabricated mastery rows and take PGHOST
      # from the environment. Six such rows were found unattributed in prod.
      - name: Destructive-rehearsal target guard — negative control (M-10)
        run: bash scripts/ci/rehearsal-host-guard-negative-control.sh

  # ---------------------------------------------------------------------------
  # Visibility job — NOT required for merge. Steps are continue-on-error so the
  # job stays green, but their failures remain visible in the logs/annotations
  # instead of being hidden. These are the remaining non-deletable gaps on main
  # (real source type errors + advisory-DB-dependent audit; see
  # docs/alignment/KNOWN-GAPS.md). Each is promoted into the required `ci` job
  # by the domain pass that fixes it. Nothing here is hidden or faked green.
  # ---------------------------------------------------------------------------
  # The failures in this job are now ACCEPTED with an owner and an expiry rather
  # than "known" in perpetuity — see ci/known-gaps.yaml. The JOB ID is left as
  # `ci-known-gaps` on purpose: renaming it would silently break any
  # branch-protection required-check that names it, and a merge-blocking config
  # change is not something to slip into a cleanup PR. Rename proposed as an
  # owner question in the PR instead.
  ci-known-gaps:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No version pin here: pnpm version is derived from package.json
        # "packageManager" (pnpm@10.33.0) — single source of truth (Q2).

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # BLOCKING, and deliberately first. Everything below may fail without
      # failing this job; this step is what keeps that permission finite. It
      # rejects an entry missing owner/expiry/reason/re_arm/command, and turns
      # red once an entry's expiry passes — so a suppression has to be renewed
      # by a human decision or the check goes back to blocking.
      - name: Accept-list gate (owner + expiry required) — BLOCKING
        run: node scripts/ci/known-gaps-gate.mjs

      - name: Accept-list gate self-test (proves it can refuse)
        run: bash scripts/ci/known-gaps-gate.self-test.sh

      # ACCEPTED under ci/known-gaps.yaml -> typecheck-ci-tsconfig, owner karl,
      # expires 2026-10-01. The gate step above fails this job once that date
      # passes. The previous comment here claimed "2 real type errors (exam
      # section field drift)"; the real count is 41 across 6 files — which is
      # what an unrenewed suppression decays into.
      - name: TypeScript Check (CI tsconfig) — accepted, expires 2026-10-01
        continue-on-error: true
        run: pnpm exec tsc -p tsconfig.ci.json

      # PROMOTED TO BLOCKING 2026-08-19. Measured before promoting: `pnpm run
      # audit:ci` reports ZERO advisories of any severity, so the
      # continue-on-error was suppressing nothing at all — it only guaranteed
      # that the first real high/critical advisory would land silently. There is
      # no accept-list entry for this because there is nothing to accept.
      - name: Security Audit (high/critical) — blocking
        run: |
          pnpm run audit:ci
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('audit-output.json','utf8'));
            const v = data?.vulnerabilities || {};
            const bad = Object.values(v).some(x => ['high','critical'].includes(String(x?.severity || '').toLowerCase()));
            if (bad) { console.error('High/Critical vulnerabilities found.'); process.exit(1); }
            console.log('No High/Critical vulnerabilities found.');
          "

      # ACCEPTED under ci/known-gaps.yaml -> eslint-legacy-tree, owner karl,
      # expires 2026-11-01. 2,368 problems; 96% are three rules, and 449 of those
      # (no-undef on a TypeScript tree) are a config defect rather than findings.
      # The standing rule — every wave lint-cleans the files it touches — is
      # recorded as the re-arm criterion in the entry, where it expires.
      # packages/shared lints BLOCKING in the required `ci` job.
      - name: ESLint (legacy tree) — accepted, expires 2026-11-01
        continue-on-error: true
        run: pnpm run lint

      - name: Summary
        run: |
          echo "::notice::Accepted failures are declared in ci/known-gaps.yaml — each with an owner, an expiry and a re-arm criterion."
          echo "::notice::The accept-list gate is BLOCKING and fails this job when an entry expires. Security audit was promoted to blocking 2026-08-19 (zero advisories)."

  # Optional integration tests — only on push to main, when secrets exist.
  # Not required for PR merge.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No version pin here: pnpm version is derived from package.json
        # "packageManager" (pnpm@10.33.0) — single source of truth (Q2).

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Integration Tests
        run: pnpm test:integration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  # ---------------------------------------------------------------------------
  # Genesis fresh-apply gate (WS-1 re-cut, Doc 00 §10 Phase 6). Proves the
  # supabase/migrations pipeline applies from scratch deterministically, matches
  # the committed expected schema, ships RLS enabled everywhere, keeps profiles.id
  # FK RESTRICT, and holds the anti-leak hard gate. No prod creds — throwaway PG.
  # ---------------------------------------------------------------------------
  genesis-fresh-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16   # owned `vector` extension must be installable (genesis declares it)
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure postgresql-client 16
        uses: ./.github/actions/ensure-psql16

      - name: Genesis fresh-apply + determinism + anti-leak gate
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/genesis-fresh-apply.sh

      # The guardian gate has never executed in production: guardian_links holds zero rows,
      # and the TypeScript that would have written one addressed columns that exist in no
      # spec, no schema, and no prod table. Every guardian test to date mocked the link layer
      # away, which is how that survived ten weeks. This gate inserts REAL rows.
      - name: guardian_view_decision gate (ONE derivation, on real guardian_links rows)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/guardian-view-decision-gate.sh

  # ---------------------------------------------------------------------------
  # Practice engine integration gate (Doc-02B_V4 §14/§20). Seeds real published
  # questions into ephemeral Postgres, exercises select_practice_pool_random,
  # verifies non-zero selection, column reconstruction, anti-leak RPC output,
  # config doctrine (quota RPC rejects missing config / succeeds with config),
  # and idempotency. No mocks — real SQL against real schema.
  # ---------------------------------------------------------------------------
  practice-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure postgresql-client 16
        uses: ./.github/actions/ensure-psql16

      - name: Practice engine integration gate (SQL seam only — no TS handler)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/practice-integration.sh

      # @spec [Codex re-audit Fix C] Handler-driven real-PG proof.
      # The bash test above proves the SQL seam; this vitest test proves the
      # TS handler actually calls applyMasteryEvent against real Postgres.
      # Would FAIL if `await applyMasteryEvent(...)` were removed from the handler.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Diagnostic handler → real PG LOGIC proof (mocked transport)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: pnpm exec vitest run tests/ci/diagnostic.handler-pg.ci.test.ts

      # @spec [Doc-01_V8 §20–§24 | STRIPE-001] Entitlement write-path → real PG proof.
      # Proves upsertEntitlement(profileId, ...) persists against the REAL genesis schema
      # (profile_id + UNIQUE(profile_id), NO account_id). Would FAIL against the old
      # account_id code (column does not exist). Also proves entitlement_active() and
      # the stripe_webhook_events idempotency gate against real PG.
      - name: Entitlement write-path → real PG proof
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: pnpm exec vitest run tests/ci/entitlement-write-path.ci.test.ts

  # ---------------------------------------------------------------------------
  # Mastery pipeline gates — HARD GATE.
  #
  # Three things nothing else covers:
  #   1. the unblock migrations, red-before/green-after against a seeded pre-state
  #   2. derivation-gap detection (the invariant: every derivable event has exactly
  #      one attributable audit row)
  #   3. the REAL transport — supabase-js -> PostgREST -> service_role JWT -> GRANT.
  #      Every other mastery test mocks the Supabase client; all of them were green
  #      throughout the outage.
  # ---------------------------------------------------------------------------
  mastery-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16   # genesis declares the `vector` extension
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure postgresql-client 16
        uses: ./.github/actions/ensure-psql16

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Red-before/green-after on a seeded pre-state, plus the portability case that
      # regression-tests the hardcoded-count blocker (a migration carrying a prod row
      # count reds every fresh apply).
      - name: Mastery unblock migration gates (1.1 + 1.2)
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/mastery-unblock-gates.sh

      # Every file under scripts/prod-verify/ is pasted by hand into the Supabase
      # SQL editor and run against production — it is NOT run with `psql -f`.
      # This executes each one the way the operator does. Every prod-verify file
      # shipped in #589..#595 failed at its first backslash meta-command and CI
      # never noticed, because CI only ever ran the CI fixtures.
      - name: prod-verify console gate (operator SQL must run in a SQL console)
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/prod-verify-console-gate.sh

      # captureDiagnosticBaseline is once-only with no retry and silently returns
      # when the projection is not ready, so a student who completed a diagnostic
      # during the mastery outage is permanently no_baseline. This guards the
      # repair — and above all that it stays a repair, never a fabricated score.
      # One-off exact-target resolution of the single duplicate diagnostic in prod
      # (ruling Q8). The fixture seeds a SECOND student's active diagnostic, which
      # is what makes it discriminate a pinned id from its superset.
      - name: Resolve-duplicate-diagnostic gate (Q8 — exact target)
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/resolve-duplicate-diagnostic-gate.sh

      - name: Baseline repair gate (BUG-1 — repair, not fabrication)
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/baseline-repair-gate.sh

      # Guards scripts/prod-verify/step8-verify.sql, which previously asserted
      # student_projection_refresh_state > 0 and so reported STOP on a completely
      # successful production backfill. Runs a REAL backfill and checks the real
      # file's verdict against it.
      - name: Step 8 backfill acceptance gate
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/step8-backfill-acceptance-gates.sh

      # Guards the two read-only files that decide whether a history repair is safe
      # (ruling Q9 puts the repair itself in the Supabase CLI's hands). Parity runs
      # FIRST and must be strict: it is the only thing between a hand-applied schema
      # and an irreversible "recorded as applied".
      # The detector reported 84 gaps out of 91 answered items on its first day in
      # production — every item the Step 8 backfill had correctly rebuilt, because
      # backfill_recompute_student writes no per-event audit row. An alert that is
      # 100% noise on arrival gets muted, which is the failure this workstream
      # exists to prevent. N4 reproduces the 84 before asserting the 0.
      - name: Gap-detector noise gate (backfill is not a gap)
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/gap-detector-noise-gate.sh

      - name: Migration history gate
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/migration-history-gate.sh

      - name: Migration inventory gate (applied vs pending discrimination)
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/migration-inventory-gate.sh

      # Session lifecycle, steps 2/1/8/9. Seven fixture students; the two that
      # earn their place are E (two ALL-NULL diagnostic_baseline rows — what the
      # evidence gate actually writes, so counting snapshot rows calls them
      # "ready") and G (a completed AND an active diagnostic at once, which is
      # production's real shape and the only way to prove the CASE precedence).
      - name: Session lifecycle DB gate (once-only index, state, abandoned_at)
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/session-lifecycle-db-gate.sh

      - name: Mastery derivation gap detection gate (2.4)
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          source scripts/ci/lib/deletion-rehearsal-db.sh
          setup_genesis_db mastery_gap_ci
          psql -v ON_ERROR_STOP=1 -d mastery_gap_ci -q -f scripts/ci/mastery-gap-detection-gates.sql
        shell: bash

      # Six level names + the drill-down catalog. The catalog replaces SAT_TAXONOMY,
      # whose invented slugs (math/advanced_math/linear_equations) never matched the
      # canonical DB values (M/Advanced Math/Linear Equations in One Variable), so the
      # skill tree resolved every node to NULL for every student.
      - name: Mastery levels + skill catalog gates (RULE 1/2/3/5)
        run: bash scripts/ci/mastery-levels-gate.sh
        shell: bash

      # The gate that would have caught this outage on day one.
      - name: Install PostgREST (real transport)
        run: |
          curl -sL -o /tmp/pgrst.tar.xz \
            https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz
          tar -xf /tmp/pgrst.tar.xz -C /tmp
          sudo mv /tmp/postgrest /usr/local/bin/postgrest
          postgrest --version

      - name: Mastery emission → REAL PostgREST transport proof (3.1)
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/mastery-transport-gate.sh

  # ---------------------------------------------------------------------------
  # Destructive-path rehearsal (Doc 01 §40.5) — HARD GATE. Applies genesis + the
  # staged (owner-run) deletion-lifecycle migration to a throwaway Postgres and
  # proves the IRREVERSIBLE deidentify_user RPC + cron eligibility filter on the
  # real schema: exact-target (only the eligible row changes, others byte-identical),
  # plus idempotency / re-entrancy. A mocked unit suite cannot prove a WHERE clause.
  # ---------------------------------------------------------------------------
  deletion-deidentify-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16   # genesis declares the `vector` extension
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure postgresql-client 16
        uses: ./.github/actions/ensure-psql16

      - name: deidentify_user exact-target + idempotency rehearsal
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/deletion-deidentify-rehearsal.sh

      - name: Negative control — rehearsal must FAIL on a broken WHERE
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/deletion-deidentify-negative-control.sh

      - name: In-app cancel atomicity (no-strand) rehearsal
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/deletion-cancel-atomicity.sh

      - name: Flag-on lifecycle e2e (request -> cron -> anonymize; recover/cancel -> restored)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/deletion-lifecycle-e2e.sh

  # ---------------------------------------------------------------------------
  # Mastery PARITY gate (Doc 05A §12 / §12.4a / §12.5) — HARD GATE. Proves the
  # PL/pgSQL compute_mastery_for_entity matches the independent Python reference
  # AND the §12 published values across all 31 fixtures, plus recompute-equivalence.
  # ---------------------------------------------------------------------------
  mastery-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16   # genesis declares the `vector` extension
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure postgresql-client 16
        uses: ./.github/actions/ensure-psql16

      - name: Mastery formula parity (PL/pgSQL == Python reference == Doc 05A §12)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/mastery-parity.sh

  # ---------------------------------------------------------------------------
  # Lane-C seam gates (Doc 05A §4) — HARD GATE. Proves the live event→mastery seam:
  # production-derivation parity (compute over the REAL canonical_mastery_events ==
  # Python reference == §12), idempotency replay, and transaction atomicity.
  # ---------------------------------------------------------------------------
  lane-c-seam-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure postgresql-client 16
        uses: ./.github/actions/ensure-psql16

      - name: Lane-C seam gates (production parity + idempotency replay + txn atomicity + F1/F2/F3 §4.9 re-proof)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/lane-c-seam-gates.sh

  # ---------------------------------------------------------------------------
  # 05B/05C rollup gates (Doc 05B §4-§10, Doc 05C §4-§8) — HARD GATES. Domain-mastery
  # parity (event-aggregation at domain grain, INV-05B-13) + KPI struct; State-A section
  # projection parity vs Doc 05C §6 worked examples (Q4 honest-gate + determinism).
  # ---------------------------------------------------------------------------
  rollup-05b-05c-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure postgresql-client 16
        uses: ./.github/actions/ensure-psql16

      - name: 05B domain mastery + KPI gates (domain-grain parity + INV-05B-13 + KPI struct)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/05b-domain-kpi-gates.sh

      - name: 05C section projection gates (State-A projection parity vs Doc 05C §6 + Q4 gate)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/05c-projection-gates.sh

      - name: Guardian-mirror gates (airtight link + entitlement + view-only + carve-outs)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/guardian-mirror-gates.sh

  # ---------------------------------------------------------------------------
  # Tutor schema-proof gate (AUD-519-008 closure — Doc 03A §18.1–§18.7). Proves
  # the tutor schema matches spec: required columns, types, enum values, RLS
  # enabled, and correct student-scoped policies across all 9 tutor_* tables.
  # Includes negative control: drops a required column and asserts the suite FAILS
  # — a gate never observed failing is not known to work.
  # ---------------------------------------------------------------------------
  tutor-schema-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure postgresql-client 16
        uses: ./.github/actions/ensure-psql16

      - name: Tutor schema-proof gate
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/tutor-schema-proof.sh

      - name: Negative control — schema-proof must FAIL on missing column
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/tutor-schema-proof-negative-control.sh
