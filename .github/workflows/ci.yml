      # ── pg17 (port 5433): the calendar, on production's major ─────────────────────

      - name: Apply the migration pipeline to a throwaway database
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE calendar_parity;" >/dev/null
          # Supabase-provided roles and auth schema; a plain Postgres has neither.
          psql -v ON_ERROR_STOP=1 -d calendar_parity -q >/dev/null <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='anon')          THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='service_role')  THEN CREATE ROLE service_role NOLOGIN; END IF;
          END $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY, email text, raw_user_meta_data jsonb);
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $f$ SELECT NULL::uuid $f$;
          SQL
          # Same sorted order scripts/ci/genesis-fresh-apply.sh uses, so the schema
          # under test is the one the pipeline produces.
          for f in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -d calendar_parity -q -f "$f" >/dev/null
          done

      - name: Calendar schema + config gates
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -d calendar_parity -f scripts/ci/calendar-schema-gates.sql
          # C-09's other half. The gate above proves generator_version LOOKS like
          # a migration timestamp; only the filesystem can say whether it names a
          # migration that exists, and a provenance stamp pointing at no file is
          # worse than none at all.
          gv="$(psql -qtAX -d calendar_parity -c "SELECT value #>> '{}' FROM public.calendar_runtime_config WHERE key = 'generator_version'")"
          if ! ls "supabase/migrations/${gv}"_*.sql >/dev/null 2>&1; then
            echo "CALENDAR_SCHEMA_GATE_FAILED: C-09 generator_version=${gv} names no migration under supabase/migrations/"
            exit 1
          fi
          echo "    OK C-09b generator_version ${gv} names $(ls supabase/migrations/${gv}_*.sql)"
          # C-09c. The stamp must name the NEWEST migration that redefines a generator
          # function -- not merely one that exists, and NOT the newest calendar migration.
          #
          # The distinction is the whole point of the stamp. Doc 05F §10.2 makes
          # generator_version the provenance on every calendar_plan_versions row, and the
          # seed's own comment names the five functions that matter: calendar_compute_plan,
          # calendar_compute_plan_fallback, calendar_place_full_lengths,
          # calendar_plan_to_output, calendar_validate_plan. A calendar migration that
          # changes RLS, a config row or calendar_build_plan_input does not change the plan
          # a given input produces, so bumping the stamp for it would make every stored
          # version claim a revision that never touched the formula.
          newest="$(grep -lE 'FUNCTION public\.(calendar_compute_plan|calendar_compute_plan_fallback|calendar_place_full_lengths|calendar_plan_to_output|calendar_validate_plan)\(' supabase/migrations/*.sql \
            | xargs -n1 basename | cut -d_ -f1 | sort | tail -1)"
          if [ "${gv}" != "${newest}" ]; then
            echo "CALENDAR_SCHEMA_GATE_FAILED: C-09c generator_version=${gv} but the newest migration redefining a generator function is ${newest}."
            echo "  A migration changed the formula without updating the provenance stamp, or the stamp was bumped for a migration that did not."
            exit 1
          fi
          echo "    OK C-09c generator_version ${gv} is the newest migration redefining a generator function"

      - name: Calendar grant + RLS gates
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -d calendar_parity -f scripts/ci/calendar-rls-gates.sql

      # QOTD (SEO Wave 2, plan Q1) and the SCL-202 anonymous ledger. Runs here because this
      # job already holds a database with the full migration pipeline applied; the gate
      # writes only inside one transaction and rolls back, so it cannot disturb the calendar
      # gates around it.
      - name: QOTD + anonymous ledger schema gates
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -d calendar_parity -f scripts/ci/qotd-schema-gates.sql

      - name: Calendar write-RPC gates
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -d calendar_parity -f scripts/ci/calendar-writer-gates.sql

      # Real concurrent sessions, not a single-session script: the FOR UPDATE on
      # the study profile that makes version_no = MAX+1 safe (INV-08-17) is
      # invisible unless somebody else is holding it. This is also where the
      # idempotency ledger's check-then-insert is proved atomic.
      - name: Calendar concurrency gate (INV-08-17, INV-08-09)
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: calendar_parity
        run: bash scripts/ci/calendar-concurrency-gate.sh

      # The 13 committed fixtures on every pull request; the seeded 3,000-plan suite in the full
      # tier (owner decision 2026-10-07).
      - name: Parity vs calendar_formula_reference.py (13 fixtures)
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: calendar_parity
          CALENDAR_PARITY_REQUIRE_PG_MAJOR: "17"
        run: pnpm exec tsx scripts/ci/calendar-parity.ts --suite-n 0

      # ── Last on each server: the PostgREST gates set BYPASSRLS on service_role (cluster-wide) ──

      # Runs tests/ci/mastery-emission.postgrest.ci.test.ts BY NAME. The gate greps
      # its own output for the EXECUTING marker and the exact case count, because a
      # self-skipping vitest file exits 0 and reads green from the outside.
      - name: Mastery emission → REAL PostgREST proof (route → supabase-js → PostgREST → PG)
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/mastery-postgrest-gate.sh

      - name: Calendar launch crash-retry → REAL PostgREST proof (INV-08-18)
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/calendar-postgrest-gate.sh

  # ---------------------------------------------------------------------------
  # Browser, every pull request: consent and minor exclusion (no PostHog traffic without
  # consent, under GPC or for an under-13 user), the QOTD answer flow (no answer in the served
  # HTML) and the crawl check. The page-CSP flow sweep runs in the full tier (owner decision
  # 2026-10-07); the built-hash CSP gate stays on every PR in `ci`.
  # ---------------------------------------------------------------------------
  analytics-consent-e2e:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.duplicate != 'true' && needs.changes.outputs.docs_only != 'true' }}
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium (the build @playwright/test pins)
        run: pnpm exec playwright install --with-deps chromium

      # A placeholder Desmos key so the calculator path is in the bundle; the page-CSP spec answers
      # www.desmos.com's calculator.js with a stand-in (E2E_DESMOS_STUB), as CI holds no key.
      - name: Build (with a dummy PostHog key so the SDK path is in the bundle)
        env:
          VITE_SUPABASE_URL: http://localhost:9
          VITE_SUPABASE_ANON_KEY: ci
          VITE_POSTHOG_KEY: phc_e2e_dummy_key_not_a_project
          VITE_DESMOS_API_KEY: ci-desmos-stub-key
        run: pnpm run build

      - name: Serve dist/public with vercel.json's headers
        run: |
          set -euo pipefail
          nohup node scripts/ops/page-csp-static-server.mjs 5175 > "$RUNNER_TEMP/static.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:5175/; then echo "static server up after ${i}s"; exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/static.log"
          exit 1

      - name: Consent → PostHog browser proof (reject, accept, GPC, under-13, withdrawal; first-touch survives a reload)
        env:
          E2E_BASE_URL: http://127.0.0.1:5175
        run: |
          set -euo pipefail
          pnpm exec playwright test tests/e2e/analytics-consent.spec.ts tests/e2e/first-touch-attribution.spec.ts --forbid-only --reporter=list

      # SEO launch hardening (Doc 10A, 2026-10-06): three proofs that existed but never ran in CI,
      # on the same built bundle and the same vercel.json headers.
      #  - INV-10A-11: the Question of the Day answer flow (no answer in the served HTML; a
      #    visitor answers end to end; zero CSP reports). Mocked API; Turnstile's api.js is
      #    answered by a stand-in at its real URL (E2E_TURNSTILE_STUB), so the CSP is still
      #    checked for it without depending on Cloudflare from CI.
      - name: QOTD answer flow (INV-10A-11)
        env:
          E2E_BASE_URL: http://127.0.0.1:5175
          E2E_TURNSTILE_STUB: "1"
        run: |
          set -euo pipefail
          pnpm exec playwright test tests/e2e/qotd-answer-flow.spec.ts --forbid-only --reporter=list

      #  - INV-10A-18: the crawler's-eye check of every sitemap URL (Googlebot and OAI-SearchBot,
      #    no JavaScript): status, own title, self-canonical, JSON-LD, body text; 404s and 301s.
      - name: Crawl check of the built site (INV-10A-18)
        run: node scripts/seo/crawl-check.mjs http://127.0.0.1:5175
