      # @spec [Doc-03_V3 §21.2 step 5, §21.3; CR-03C-V3-01 §3.4; WS-L8 Item 4b;
      #        owner ruling 2026-09-22 D1] | @implemented [2026-09-22]
      # Flagging a conversation for crisis review used to be two writes in sequence, and
