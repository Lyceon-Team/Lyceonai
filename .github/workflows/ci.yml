name: CI

# THE FAST LANE (owner decisions 2026-10-07 on the CI audit). Every pull request and every push
# to main/cleanup runs this workflow: typecheck, lint, build, the whole unit suite, every anti-leak,
# idempotency-replay, denial and redaction check (Coding Standards §14), migration apply, the legal
# immutability gate and the Postgres suites. What moved out runs in the full tier (ci-full.yml) on
# every pull request into `main` before it merges, and on `main` itself; external-drift checks run
# nightly (nightly.yml). Nothing is removed from the path to `main`.
on:
  pull_request:
  push:
    branches: [main, cleanup]

# CI minutes (brief 2026-10-07). A newer push to a pull request supersedes the run still testing
# the old head, so that run is cancelled: its result could no longer gate anything. Push runs on
# `main` and `cleanup` each get a group of their own (the run id), so no push run is ever cancelled
# or dropped from a queue.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

# CI runs without secrets by default (for forks and basic validation).
# Secrets are only required for integration tests, which are skipped here.
env:
  CI: true

jobs:
  # ---------------------------------------------------------------------------
  # Run scope (CI-minutes brief 2026-10-07; no gate weakened). Decides, and fails OPEN:
  #   duplicate  a push to main/cleanup whose exact tree already passed a full PR run → nothing
  #              re-runs (the `integration` job, push-to-main only, is unaffected);
  #   docs_only  a PR into an integration branch (never into main) changing only docs no gated
  #              job reads → the database, e2e and GCP jobs skip; `ci` still runs.
  # Every job's `if:` starts with !cancelled(), so a failed scope job runs everything, never
  # nothing. scripts/ci/ci-run-scope.sh has the rules; scripts/ci/ci-scope-guard.mjs keeps
  # "no gated job reads those docs" true.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      duplicate: ${{ steps.scope.outputs.duplicate }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      tree: ${{ steps.scope.outputs.tree }}
      # The change itself, for the review UI gate's plant selection, and the path groups that
      # switch change-triggered checks on (scripts/ci/ci-path-groups.mjs). Unknown means
      # everything: changed_known=false and every group true.
      changed_known: ${{ steps.files.outputs.known }}
      changed_files: ${{ steps.files.outputs.changed_files }}
      review_ui_gate: ${{ steps.groups.outputs.review_ui_gate }}
      boot_probe: ${{ steps.groups.outputs.boot_probe }}
      section_vocabulary: ${{ steps.groups.outputs.section_vocabulary }}
      fixture_canonicality: ${{ steps.groups.outputs.fixture_canonicality }}
      guardian_dead_code: ${{ steps.groups.outputs.guardian_dead_code }}
      deps: ${{ steps.groups.outputs.deps }}
      question_tooling: ${{ steps.groups.outputs.question_tooling }}
    steps:
      - name: Checkout (with parents, for the PR diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Decide the run scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          CHANGED_FILES_OUT: ${{ runner.temp }}/changed-files.txt
        run: bash scripts/ci/ci-run-scope.sh

      - name: Path groups (which change-triggered checks this run includes)
        id: groups
        run: node scripts/ci/ci-path-groups.mjs "$RUNNER_TEMP/changed-files.txt" >> "$GITHUB_OUTPUT"

      - name: Expose the changed files
        id: files
        run: |
          f="$RUNNER_TEMP/changed-files.txt"
          if [ -f "$f" ]; then
            echo "known=true" >> "$GITHUB_OUTPUT"
            { echo "changed_files<<CHANGED_FILES_EOF"; cat "$f"; echo "CHANGED_FILES_EOF"; } >> "$GITHUB_OUTPUT"
            echo "$(wc -l < "$f") changed files"
          else
            echo "known=false" >> "$GITHUB_OUTPUT"
            echo "changed files unknown: every change-triggered check runs"
          fi

      # A full PR run records the tree it tests, so the push that merges exactly this tree can
      # recognise it. The marker counts only if the run it belongs to concludes `success`.
      - name: Record the tested tree (full PR runs only)
        if: github.event_name == 'pull_request' && steps.scope.outputs.docs_only != 'true'
        run: echo "${{ steps.scope.outputs.tree }}" > tested-tree.txt

      - name: Upload the tested-tree marker
        if: github.event_name == 'pull_request' && steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-tested-tree-${{ steps.scope.outputs.tree }}
          path: tested-tree.txt
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Required gate (the only required check on main and cleanup). Since 2026-10-07 it also
  # carries the former ci-known-gaps job's blocking steps (accept-list gate and its self-test).
  # Node version comes from .nvmrc (single source of truth shared with local dev).
  # ---------------------------------------------------------------------------
  ci:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.duplicate != 'true' }}
    # 25. The review UI mutation gate that needed 45 (owner decision 2026-10-03) now runs only
    # the plants a change touches here, and all of them in the full tier (owner decision
    # 2026-10-07, CI audit item 3).
    timeout-minutes: 25

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history for the accept-list ratchet (CI-GATING-003): git merge-base needs
          # common ancestry with the PR base branch.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No version pin here: pnpm version is derived from package.json
        # "packageManager" (pnpm@10.33.0) — single source of truth (Q2).

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # BLOCKING, and deliberately first. Everything below may fail without
      # failing this job; this step is what keeps that permission finite. It
      # rejects an entry missing owner/expiry/reason/re_arm/command, and turns
      # red once an entry's expiry passes — so a suppression has to be renewed
      # by a human decision or the check goes back to blocking.
      - name: Accept-list gate (owner + expiry required) — BLOCKING
        run: node scripts/ci/known-gaps-gate.mjs

      - name: Accept-list gate self-test (proves it can refuse)
        run: bash scripts/ci/known-gaps-gate.self-test.sh

      # The accepted "TypeScript Check (CI tsconfig)" step that stood here was retired on
      # 2026-09-30 per its own re-arm condition (ci/known-gaps.yaml, typecheck-ci-tsconfig: "Delete
      # this entry and drop continue-on-error once `pnpm exec tsc -p tsconfig.ci.json` exits 0").
      # Both it and `pnpm run check` exit 0; the blocking "TypeScript check — whole app" step in the
      # `ci` job covers every file it did.

      # On a pull request only when a manifest or the lockfile changes (an advisory published
      # tonight must not turn an unrelated PR red); every night in nightly.yml against `main`
      # (owner decision 2026-10-07). PROMOTED TO BLOCKING 2026-08-19. Measured before promoting: `pnpm run
      # audit:ci` reports ZERO advisories of any severity, so the
      # continue-on-error was suppressing nothing at all — it only guaranteed
      # that the first real high/critical advisory would land silently. There is
      # no accept-list entry for this because there is nothing to accept.
      - name: Security Audit (high/critical) — blocking
        if: ${{ needs.changes.outputs.deps == 'true' }}
        run: |
          pnpm run audit:ci
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('audit-output.json','utf8'));
            const v = data?.vulnerabilities || {};
            const bad = Object.values(v).some(x => ['high','critical'].includes(String(x?.severity || '').toLowerCase()));
            if (bad) { console.error('High/Critical vulnerabilities found.'); process.exit(1); }
            console.log('No High/Critical vulnerabilities found.');
          "

      - name: Validate Route Registry
        run: pnpm run route:validate

      # ZERO NESTED ANCHORS (issue #829). Sixteen files carried the wouter v2 idiom —
      # a bare `<a>` child inside `<Link>` — which under wouter 3 renders `<a href><a
      # data-testid>`, leaving the inner anchor (the one with the testid, the label and
      # the click target) with no href at all. Middle-click, ⌘-click, open-in-new-tab,
      # copy-link and screen-reader link announcement were dead on every tab in the
      # product; a plain left click worked, which is why nobody noticed.
      #
      # `--selftest` runs FIRST and on its own line. A gate whose own matcher has rotted
      # reports zero occurrences and reads exactly like a clean tree, so the fixtures are
      # exercised before the scan is believed. The `asChild` exemption is by SHAPE, never
      # by filename — see the script's header for why that distinction is load-bearing.
      - name: "No nested anchors (issue #829)"
        run: |
          set -euo pipefail
          node scripts/ci/nested-anchor-gate.mjs --selftest
          node scripts/ci/nested-anchor-gate.mjs

      # No SCL id may head two entries in the register. Collisions keep reaching
      # it — SCL-021, SCL-024, SCL-042, SCL-043, and SCL-171/SCL-172 twice over
      # on 2026-09-26 — despite every author having read the register first.
      # Reading does not reserve a number, so only a mechanical check closes the
      # same-day race. The allowlist inside the script is now EMPTY: every
      # pre-existing collision was renumbered on 2026-09-26, so the register has
      # no duplicate heading at all and ANY duplicate fails here on its first
      # appearance.
      # §17.1's band is Doc 05C's, summed. The selftest runs FIRST and on its own line: a
      # gate whose matcher has rotted reports zero findings and reads exactly like a clean
      # tree.
      - name: Calendar projection is read, never recomputed
        run: |
          set -euo pipefail
          node scripts/ci/calendar-projection-gate.mjs --selftest
          node scripts/ci/calendar-projection-gate.mjs

      - name: SCL register — no duplicate ids
        run: node scripts/ci/scl-duplicate-check.mjs

      # Full deterministic CI suite. The stale-mock contract files were deleted
      # in Pass 0 (clean delete + rebuild later — see docs/alignment/KNOWN-GAPS.md),
      # so this runs green with no exclusions.
      # WHOLE SUITE, BLOCKING. This step used to run `test:ci` = `vitest run
      # tests/ci`, a fraction of the repo's tests. The rest were reported for
      # weeks as "pre-existing, gated" while running in no job at all — path
      # scope is a worse suppression than an accept-list, because it leaves no
      # record and the files still read as coverage.
      #
      # EXACT ARITHMETIC, re-measured at this head (the earlier comment said
      # 182/170 and was stale by one file after the dead test was deleted):
      #
      #   181 tracked *.{test,spec}.{ts,tsx}
      #   = 169 vitest-selected
      #   +   9 Playwright .spec.ts   — match no vitest `include`, run in NO job
      #   +   2 tests/integration/**  — excluded; the `integration` job owns them
      #   +   1 tests/auth.integration.test.ts — excluded as "moved to
      #                                  tests/integration/", but the original is
      #                                  still tracked. A stale duplicate.
      #
      # REPORT SELECTED AND PASSED SEPARATELY. A green run reads
      # `161 passed | 8 skipped (169)` — 169 selected, 161 passed, 8 skipped.
      # Quoting the passed count as though it were the selected count is how a
      # skip becomes invisible, which is the same class of error as counting a
      # file that never ran as coverage.
      #
      # Cost measured on the RUNNER, not locally: 17.3s -> 54.3s. The PR body
      # originally said +25s from local timing; the hosted figure is +37s. Still
      # well inside the budget for a job that was ~45s, so no fast/full split is
      # proposed — but the number quoted is the one from the machine that
      # actually gates merges.
      - name: Run Tests (whole suite — blocking)
        run: pnpm test
        # tests/assemble-batch.test.ts (27 s, question-authoring tooling no production entry
        # imports) runs here only when the question tooling changes, and always in the full tier.
        env:
          CI_SKIP_FULL_TIER_TESTS: ${{ needs.changes.outputs.question_tooling != 'true' }}

      # @spec [Coding Standards §3.1; student-ui register F-24; owner brief 7] | @implemented
      # [2026-09-30] | BLOCKING. `pnpm run check` is `tsc` over the root tsconfig — every file the
      # retired CI-tsconfig step checked (tsconfig.ci.json), plus four more — and exits non-zero on
      # any error. It reached 0 errors on 2026-09-30 (41 → 26 → 0); from here a new type error
      # fails this job instead of joining an accepted count.
      - name: TypeScript check — whole app (blocking)
        run: pnpm run check

      # Wave 0 canonical primitives (@lyceon/shared): the new SSOT is born proven —
      # strict typecheck, its own tests, and lint at error level all BLOCKING.
      - name: Shared package — typecheck (blocking)
        run: pnpm run check:shared

      - name: Shared package — lint (blocking)
        run: pnpm run lint:shared

      # Codex audit of #1073 + #1108 + #1113, finding 1 (HIGH), accepted by Karl 2026-10-05:
      # no console.* in shipped client code. `pnpm lint` already sets no-console to error but
      # runs in the advisory ci-known-gaps job; this step is the blocking one. One rule only,
      # inline disable comments ignored (eslint.no-console.config.mjs explains its two SEO-owned
      # exclusions, register F-74).
      - name: Client — no console (blocking)
        run: pnpm run lint:no-console

      # Codex re-audit of #1073 + #1108 + #1113, finding 4, ruled by Karl 2026-10-06: no unused
      # file, export, exported type or duplicate export in the student-UI scope
      # (scripts/ci/deadcode-student.scope.json), knip 5.88.1 in production mode. The rest of the
      # repo's knip backlog is other verticals' (student-UI register §8 F-77), not gated here.
      - name: Student UI — dead code (blocking)
        run: |
          set -euo pipefail
          node scripts/ci/deadcode-student.mjs --selftest
          pnpm run deadcode:student

      # build:vercel is a superset of build: it runs `build` and then emits
      # dist/vercel-api.cjs, the CJS bundle Vercel actually loads. CI used to
      # build only dist/index.js, so the artifact production runs was never
      # compiled here — which is part of why a bundle that could not start was
      # able to pass CI on 2026-08-27.
      - name: Build (including the Vercel production bundle)
        run: pnpm run build:vercel

      - name: SEO output gate (sitemap ↔ registry ↔ prerendered pages, F1/F3)
        run: pnpm run gate:seo-output

      - name: Boot probe (production bundle must complete module load)
        run: pnpm run probe:boot

      # Its gate script rarely changes: on a pull request this runs when the gate does; it always
      # runs in the full tier (owner decision 2026-10-07).
      - name: Boot probe self-test (proves each failure mode turns it red)
        if: ${{ needs.changes.outputs.boot_probe == 'true' }}
        run: bash scripts/ci/boot-probe.selftest.sh

      # Register §8 F-59: the page CSP in vercel.json must allow exactly the inline scripts the
      # BUILT page ships (the source-file test cannot see what Vite writes).
      - name: Page CSP matches the built inline scripts (F-59)
        run: node scripts/ci/page-csp-built-hash-gate.mjs

      - name: Page CSP gate self-test (proves each rule turns it red)
        run: bash scripts/ci/page-csp-built-hash-gate.selftest.sh

      # @spec [Codex audit Finding 4] The worker's tsconfig uses NodeNext, which
      # rejects extensionless relative imports (TS2835). The monorepo root build
      # does NOT compile apps/workers/, so a broken import passes CI until
      # Cloud Build fails in production. This step runs the isolated worker
      # typecheck so extensionless imports are caught here, not in deploy.
      - name: Worker isolated typecheck (NodeNext — extensionless imports gate)
        run: cd apps/workers/tutor-orchestrator && pnpm exec tsc -p tsconfig.json --noEmit

      - name: Check No Test Routes in Dist
        run: node scripts/ci/check-no-test-routes-dist.mjs

      # E7b: the exam e2e harness stubs auth to one student. It must be unreachable
      # from production: nothing outside tests/ names it, the bundle built above
      # carries none of its markers, and it refuses NODE_ENV=production.
      - name: Exam e2e harness is unreachable from the production build (E7b)
        run: bash scripts/ci/exam-harness-isolation.sh

      - name: Exam e2e harness isolation self-test (proves each rule turns it red)
        run: bash scripts/ci/exam-harness-isolation.selftest.sh

      - name: No hardcoded constants (Lane-A gate — DB is source of truth)
        run: node scripts/ci/no-hardcoded-constants.mjs

      - name: Tutor never writes mastery (C-7 / INV-03-01)
        run: node scripts/ci/tutor-never-writes-mastery.mjs

      # SAT_TAXONOMY shipped slugs ('math', 'advanced_math', 'linear_equations')
      # against a database holding 'M', 'Advanced Math', 'Linear Equations in One
      # Variable'. Nothing joined and the mastery page said "No Mastery Data Yet" to
      # every student who had data. It survived because the TESTS seeded the same
      # slugs: the suite agreed with the broken code instead of with the schema.
      - name: Test fixture canonicality gate (section/domain must match the DB CHECKs)
        run: node scripts/ci/test-fixture-canonicality-gate.mjs

      # Its gate script rarely changes: on a pull request this runs when the gate does; it always
      # runs in the full tier (owner decision 2026-10-07).
      - name: Fixture canonicality self-test (proves each mutation turns it red)
        if: ${{ needs.changes.outputs.fixture_canonicality == 'true' }}
        run: bash scripts/ci/test-fixture-canonicality-gate.selftest.sh

      # Five section vocabularies coexisted here: 'M'/'RW' (what all sixteen CHECK
      # constraints accept), 'MATH'/'RW', 'Math'/'Reading & Writing', 'math'/'rw', and
      # 'Math'/'RW'/'Random'. The last one reached storage — jsonb, inside
      # practice_sessions.filters, the one section field no CHECK can see — and thirteen
      # production rows held it. This gate keeps the count at one.
      - name: Section vocabulary gate (no section literal outside M/RW off the display path)
        run: node scripts/ci/section-vocabulary-gate.mjs

      # Its gate script rarely changes: on a pull request this runs when the gate does; it always
      # runs in the full tier (owner decision 2026-10-07).
      - name: Section vocabulary self-test (proves each mutation turns it red)
        if: ${{ needs.changes.outputs.section_vocabulary == 'true' }}
        run: bash scripts/ci/section-vocabulary-gate.mutations.sh

      # Deleting a route removes the server half; a forgotten caller fails at RUNTIME as a
      # 404 the UI renders as an error state or an empty list. The path is a string, so tsc
      # cannot see it — only a text search over the committed tree can.
      # R4's review UI shares practice's question loop through an engine config, so a
      # careless edit to the loop can silently break one engine while the other's tests
      # stay green. This gate plants ten mutations in PRODUCT SOURCE — a wrong endpoint,
      # a pre-submit reveal, a session id kept out of the URL, a missing entry mode, a
      # UTC day header, an error state for an empty pool, both halves of "abandoned
      # sessions never appear", a removed nav entry, a removed allowlist entry — and
      # fails unless each one turns its own U-test red and reverts byte-identically.
      # Sharded since 2026-10-07 (CI-minutes brief): the same plants, one per worktree of HEAD,
      # one shard per core. The driver also requires every plant to run exactly once and every
      # worktree to end byte-identical to HEAD. It was ~24 of this job's ~30 minutes serially.
      # Owner decision 2026-10-07 (CI audit item 3): on a pull request, only the plants whose
      # target file or test the change touches (all of them when the harness itself changes, or
      # when the change is unknown); every plant in the full tier (ci-full.yml) before `main`.
      - name: Review UI mutation gate — the plants this change touches (proves U1-U9 are load-bearing)
        env:
          CHANGED_KNOWN: ${{ needs.changes.outputs.changed_known }}
          CHANGED_FILES: ${{ needs.changes.outputs.changed_files }}
          ALL_PLANTS: ${{ needs.changes.outputs.review_ui_gate }}
        run: |
          set -euo pipefail
          if [ "$CHANGED_KNOWN" = true ] && [ "$ALL_PLANTS" != true ]; then
            printf '%s\n' "$CHANGED_FILES" > "$RUNNER_TEMP/review-ui-changed.txt"
            export REVIEW_UI_GATE_ONLY_CHANGED="$RUNNER_TEMP/review-ui-changed.txt"
          fi
          bash scripts/ci/review-ui-gate.parallel.sh

      # The docs-only skip (changes job) is sound only while no job it skips reads those docs.
      - name: CI scope guard (no job skipped on docs-only PRs reads docs)
        run: node scripts/ci/ci-scope-guard.mjs

      - name: CI scope guard self-test (proves each mutation turns it red)
        run: node scripts/ci/ci-scope-guard.mjs --selftest

      - name: Retired endpoints gate (no caller of a deleted route may remain)
        run: node scripts/ci/retired-endpoints-gate.mjs

      - name: Retired endpoints self-test (proves each mutation turns it red)
        run: bash scripts/ci/retired-endpoints-gate.selftest.sh

      # "Every subject-scoped handler is role-blind" is an ALL-ROUTES property, and any
      # all-routes property is a chokepoint: enforced once, never per route. Three privilege
      # divergences in this vertical were each found by collapsing two independently-written
      # paths; while two paths serve one resource a fourth instance is a schedule, not a risk.
      - name: Subject-resolver chokepoint gate (no handler below the resolver learns the caller's role)
        run: node scripts/ci/subject-resolver-chokepoint-gate.mjs

      # The consent surface was written against columns that do not exist and CI stayed green
      # for months, because the tests mocked Supabase and returned fixtures spelling the same
      # imagined names. Code and mock agreed; neither was ever compared to Postgres. This
      # forbids both halves on guardian paths — a query-layer mock with no real pg.Client
      # behind it, and a hand-written row literal.
      - name: Guardian schema-truth gate (no mocked query layer, no hand-written rows)
        run: node scripts/ci/guardian-schema-truth-gate.mjs

      - name: Guardian schema-truth self-test (proves each rule turns it red)
        run: bash scripts/ci/guardian-schema-truth-gate.selftest.sh

      # G4-07 (R12): guardian files take colour from the token set, never a hex literal, and
      # no text utility under 16px; the calendar's generated 16px floor must match calendar.css.
      # Legacy unrouted files are excluded by name, and the gate fails if anything imports one.
      - name: Guardian token gate (no hex literals, no sub-16px text, type floor current)
        run: node scripts/ci/guardian-token-gate.mjs

      # Its gate script rarely changes: on a pull request this runs when the gate does; it always
      # runs in the full tier (owner decision 2026-10-07).
      # Guardian closeout, Part B step 4: no unused export and no test-only module in guardian
      # scope (scripts/ci/guardian-dead-code-gate.mjs — the TypeScript compiler API over the
      # repository's import graph, no new dependency). The self-test runs FIRST: it plants an
      # unused export and a test-only module and requires the gate to name each, so a gate that
      # has gone blind reads as a failure here rather than as a clean tree.
      - name: Guardian dead-code gate self-test (planted findings must be named)
        if: ${{ needs.changes.outputs.guardian_dead_code == 'true' }}
        run: bash scripts/ci/guardian-dead-code-gate.selftest.sh

      - name: Guardian dead-code gate (zero unused exports in guardian scope)
        run: node scripts/ci/guardian-dead-code-gate.mjs

      # A published legal version directory is the evidence of what somebody
      # agreed to — ARL § 17602(a)(4) requires producing that exact text three
      # years later. Editing one destroys the evidence while the consent record
      # still names it. The gate asks git, not the content_hash sitting beside
      # the file: an author who edits en.md and updates the hash in the same
      # commit defeats a self-referential check, and that is the shape the
      # mistake actually takes. Case (B) of the self-test is exactly that.
      # The immutability gate compares against the base branch, and the
      # default checkout is shallow with no remote-tracking ref for it. Fetch
      # exactly the one commit it needs. If this fetch fails the gate exits 2
      # and says so — it will not pass without a comparison point.
      - name: Fetch base ref for the legal immutability gate
        run: |
          # `github.base_ref` is empty on a push event, so the fallback is what a push to an
          # integration branch actually uses. It must name a branch that cannot disappear:
          # the previous value, `stripe`, was deleted after merging and took this gate's
          # comparison point with it, turning the push build red on every integration branch.
          BASE="${{ github.base_ref || 'main' }}"
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/$BASE:refs/remotes/origin/$BASE" || true

      - name: Legal versioning gates (immutability, manifest, cross-reference, body purity)
        run: pnpm run gate:legal

      - name: Legal gates self-test (proves each rule turns them red)
        run: pnpm run gate:legal:selftest

      # 2026-09-16 incident: the SERVER started resolving legal metadata from
      # `legal/` at request time, the Vercel function has no such tree, and every
      # consent lookup threw — /api/profile 500 and sign-in down. The renderer's
      # path had a gate; the server's did not. This asserts the generated
      # registry is current AND that the built function bundle really carries it.
      - name: Legal registry reaches every runtime (incident 2026-09-16)
        run: pnpm run gate:legal-registry

      # Doc 07A §11.1 / §11.2 (launch-required, hard-fail at V1). Parity: every emitEvent name is
      # registered, PostHog SDKs are imported only by the two permitted modules (SCL-201 IS 2),
      # redaction keys equal property keys, and the bundled registry module is current.
      # Conformance: every property has a runtime redaction posture and none is a forbidden
      # identifier type.
      - name: ci/event-schema-registry-parity (Doc 07A §11.1)
        run: pnpm run gate:event-registry-parity

      - name: ci/pii-redaction-conformance (Doc 07A §11.2)
        run: pnpm run gate:pii-redaction

      # practice_sessions.mode decides event_source_kind, so accepting it as free
      # text let a client classify its own activity in the mastery record AND
      # create a diagnostic session through the practice route, bypassing the
      # once-only guard. Integrity bypass, not a lifecycle bug.
      - name: Session-mode boundary gate (BUG-3 — client cannot name its own mode)
        run: node scripts/ci/session-mode-boundary-gate.mjs

      # The RULE is unit-tested in packages/shared; this covers the seam the unit
      # test cannot see — narrowing the route's status filter back to
      # ['created','active'] means the rule never receives the completed row and a
      # second diagnostic is startable again, with every unit test still green.
      - name: Diagnostic once-only gate (BUG-2 — no retake)
        run: node scripts/ci/diagnostic-once-only-gate.mjs

      # The diagnostic lifecycle is declared in three places that cannot import
      # from each other: the CASE arms in the migration, DIAGNOSTIC_STATES in
      # packages/shared, and the EstimateStatus union in the client (which has no
      # module path to packages/shared). A state the SQL emits and the TypeScript
      # cannot name degrades the student silently; a status the server emits and
      # the client cannot name renders a blank card, not a type error.
      - name: Diagnostic state drift gate (SQL <-> shared <-> client)
        run: node scripts/ci/diagnostic-state-drift-gate.mjs

      - name: Guards proven by planted violations (B-WS3-1 §E)
        run: bash scripts/ci/guards-selftest.sh

      - name: Practice schema-types gate (STRUCTURAL 1 — no phantom columns)
        run: bash scripts/ci/practice-schema-types-gate.sh

      - name: Wire-contract drift gate (AUD-519-007 — L1.4 single-contract)
        run: diff shared/tutor-orchestrator-wire.ts apps/workers/tutor-orchestrator/src/lib/_tutor-orchestrator-wire.generated.ts

      - name: Safety-constants drift gate (AUD-B1.1c-010 — anti-leak + boundary mirrors)
        run: diff shared/tutor-safety-constants.ts apps/workers/tutor-orchestrator/src/lib/_tutor-safety-constants.generated.ts

      # Mastery emission failed 100% of the time for seven weeks unnoticed. These two
      # gates block the two defects that made that invisible: console.* on mastery
      # paths, and a miscalled structured logger that put the data object into `event`
      # (which no log filter can match).
      - name: Mastery emission observability gate (M-05 / M-07)
        run: node scripts/ci/mastery-emission-observability.mjs

      # The destructive rehearsal scripts seed fabricated mastery rows and take PGHOST
      # from the environment. Six such rows were found unattributed in prod.
      - name: Destructive-rehearsal target guard — negative control (M-10)
        run: bash scripts/ci/rehearsal-host-guard-negative-control.sh


  # Optional integration tests — only on push to main, when secrets exist.
  # Not required for PR merge.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No version pin here: pnpm version is derived from package.json
        # "packageManager" (pnpm@10.33.0) — single source of truth (Q2).

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # THIS JOB HAD NEVER PASSED. It ran `vitest run tests/integration` against the
      # DEFAULT config, which excludes `tests/integration/**` so the unit suite stays
      # hermetic -- so the filter selected a directory the config had already excluded and
      # vitest exited 1 with "No test files found" on every push to main. Both tests are
      # real and all three secrets were already wired; nothing ran them.
      #
      # `test:integration` now names `vitest.integration.config.ts`, which does not carry
      # that exclusion. The summary gate is the other half: these tests `describe.skipIf`
      # themselves when a Supabase secret is absent, so without it a missing secret would
      # turn the job from loudly broken into silently green -- testing nothing and saying
      # so to nobody. If it goes red naming skipped tests, a secret is missing, and the
      # message says which.
      - name: Run Integration Tests
        run: |
          set -euo pipefail
          pnpm exec vitest run --config vitest.integration.config.ts \
            --reporter=default --reporter=json --outputFile=/tmp/vitest-integration.json
          node scripts/ci/vitest-summary-gate.mjs --json /tmp/vitest-integration.json \
            --file tests/integration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  # ---------------------------------------------------------------------------
  # Postgres, every pull request: migration apply (genesis fresh-apply, the anti-leak grant
  # gate), every real-Postgres anti-leak / idempotency-replay / denial proof, the parity
  # suites and the calendar gates — the eleven former Postgres jobs in one (owner decision
  # 2026-10-07). Their mutation harnesses and self-tests run in the full tier (ci-full.yml).
  # ---------------------------------------------------------------------------
  pg:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.duplicate != 'true' && needs.changes.outputs.docs_only != 'true' }}
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      # Two servers, one job (owner decision 2026-10-07, CI audit item 2: "Postgres jobs
      # consolidated"). Every script and test creates its own database, so the eleven jobs that
      # each started a server now share these two. pg16 (port 5432) is the pipeline's genesis
      # major; pg17 (port 5433) is production's, which the calendar formula is proved on (Doc 05F
      # formula sheet §6) — the calendar steps set PGPORT 5433. The two PostgREST gates run LAST
      # on their server: each sets BYPASSRLS on service_role, which is cluster-wide.
      postgres:
        image: pgvector/pgvector:pg16   # genesis declares the `vector` extension
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres17:
        image: pgvector/pgvector:pg17   # prod major; the calendar parity gate requires it
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No version pin here: pnpm version is derived from package.json
        # "packageManager" — single source of truth (Q2).

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure postgresql-client 16
        uses: ./.github/actions/ensure-psql16

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # INV-08-18 through the REAL transport. The recorder-based launch tests prove the
      # sequence ARITHMETIC; only this proves that calendar_link_launch and the practice
      # engine's own idempotency ledger, reached over a wire as a real service_role JWT,
      # agree about what a repeated key means. The gate greps its own output because a
      # self-skipping vitest file exits 0 and reads green from the outside.
      - name: Install PostgREST (real transport)
        run: |
          curl -sL -o /tmp/pgrst.tar.xz \
            https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz
          tar -xf /tmp/pgrst.tar.xz -C /tmp
          sudo mv /tmp/postgrest /usr/local/bin/postgrest
          postgrest --version

      # ── pg16 (port 5432): genesis, exam, scoring ────────────────────────────────

      - name: Genesis fresh-apply + determinism + anti-leak gate
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/genesis-fresh-apply.sh

      # The guardian gate has never executed in production: guardian_links holds zero rows,
      # and the TypeScript that would have written one addressed columns that exist in no
      # spec, no schema, and no prod table. Every guardian test to date mocked the link layer
      # away, which is how that survived ten weeks. This gate inserts REAL rows.
      - name: guardian_view_decision gate (ONE derivation, on real guardian_links rows)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/guardian-view-decision-gate.sh

      # Doc 04B V4.3 §7.2/§8.1/§8.2/§8.4 — every scoring-catalogue constraint is made
      # to FIRE on a fresh apply: the INSERT/UPDATE/DELETE seal on an active version's
      # constants, the attestation CHECK, the no-downgrade trigger, the (version, key,
      # section) unique index, the raise-on-miss helper, and the partial unique index
      # under a real two-session race (the friendly trigger cannot see the other
      # transaction, so only the index can refuse it). Each check asserts its own
      # SQLSTATE and constraint/message and must print its own `ok` line.
      # @spec [Doc-04B_V4.3, §7.2, §8.1, §8.2, §8.4, Appendix A] | @implemented [2026-09-23]
      - name: Scoring catalogue gates (04B §7.2/§8 constraints observed firing)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/scoring-catalogue-gates.sh

      # Doc 04A V2.2 §5/§6/§9 + Doc 04B §13 as amended (owner ruling 2026-09-24,
      # SCL-121) — every exam-runtime constraint is made to FIRE on a fresh apply,
      # against synthetic fixtures: published-form and published-item immutability,
      # the one-way status machine, module2_path lock, the publish gate (since E4
      # v1.0 is active: publish succeeds against it and is refused for a candidate
      # or superseded version), the ruled
      # per-module composition tallies (difficulty / grid-in / domain, each miss
      # naming its cell), form-item uniqueness, answer-upsert idempotency, and the
      # account-deletion cascade. Each check asserts its SQLSTATE and constraint/message.
      # @spec [Doc-04A_V2.2, §5, §6, §9.2, §11.2; Doc-04B_V4.3, §13] | @implemented [2026-09-24]
      - name: Exam runtime schema gates (04A §5/§6/§9 constraints observed firing)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/exam-runtime-schema-gates.sh

      # Doc 04B V4.3 §9-§12 (E4) — every scoring-engine constraint is made to FIRE on
      # a fresh apply that ends with v1.0 ACTIVE: the activation row and its three
      # attestation fields, insert-once by each layer separately (privilege 42501,
      # trigger P0001, unique 23505, RLS 0 rows), the post-activation constants seal,
      # the NaN/Infinity/key-charset CHECKs, the version gate (candidate blocked,
      # superseded scores — §19.6), replay idempotency, the presented-item filter,
      # blanks-count-wrong, partial scoring, and the account-deletion cascade.
      # @spec [Doc-04B_V4.3, §9, §10, §11, §12, §19; SCL-128, SCL-129] | @implemented [2026-09-24]
      - name: Scoring engine gates (04B §9-§12 constraints observed firing)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/scoring-engine-gates.sh

      # Doc 04B V4.3 §18.2 / Appendix B + owner ruling (repo-hosted packet): the
      # committed packet hashes to 29c3e0fd… (= validation_packet_sha256 of v1.0),
      # its validation_sweep.py is byte-identical to docs/Spec, and it regenerates.
      # @spec [Doc-04B_V4.3, §18.2, Appendix B] | @implemented [2026-09-24]
      - name: Scoring evidence packet (hash + provenance)
        run: bash scripts/ci/scoring-evidence-packet-check.sh

      # Doc 04A V2.2 §4/§7-§16 + E6 rulings — the exam runtime functions the API calls,
      # driven on a fresh apply: RLS on every exam table AS `authenticated` (own rows
      # only, B's rows invisible, answer/routing columns not granted), server-time
      # expiry (409 module_submitted, section timed out), routing lock, idempotent
      # replay (one ledger row), module '2' -> locked path, strict break bounded /
      # lenient unbounded, lenient pause vs strict, inline finalisation of past-grace
      # sessions with a partial score, and the sweep. Each check prints its own `ok`.
      # @spec [Doc-04A_V2.2, §4, §7-§16; SCL-131..136] | @implemented [2026-09-24]
      - name: Exam runtime API gates (04A runtime behaviour + RLS, E6)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/exam-runtime-api-gates.sh

      # Doc 05E §5.1/§6 + Doc 05D §10 (E6b, SCL-143) — the exam tables in the
      # account-deletion cascade: whole exams walked through the runtime functions and
      # scored, then both modes. anonymize retains sessions, children, scores, ledger and
      # outbox with student_id NULL and actor_id intact; hard_delete removes and counts
      # every table; the INV-05E-07 sentinel refuses an ungrouped exam row; a pending or
      # in-progress exam of an anonymised student still scores (student_id NULL); a
      # re-run is a no-op; the insert-once trigger still refuses every caller mutation.
      # @spec [Doc-05E §1, §5.1, §6; Doc-05D §10.5; Doc-04B_V4.3 §9.4; SCL-143] | @implemented [2026-09-24]
      - name: Exam deletion cascade gates (both modes, E6b)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/exam-deletion-cascade-gates.sh

      # E7a (SCL-145..149) — the exam shell's server pieces, on a fresh apply: the item
      # workspace (served tokens only — a canonical letter, another item's token or a
      # repeat is refused; highlights are code-point offsets inside the passage; no notes;
      # active module and owner only), the heartbeat's resume position (read back only in
      # the module it names), GET /forms (drafts never listed, no thresholds), the 04C
      # report source (one 403 for missing and foreign sessions, the dead-letter failure
      # stand-in, the v1.0 disclosure seeded from 04B §17.1 verbatim) and grants.
      # @spec [Doc-04A_V2.2 §8.3, §15.1, §16; Doc-04C_V1.0 §5.3, §15.2, §16.6] | @implemented [2026-09-25]
      - name: Exam shell server gates (workspace, resume, forms, report source — E7a)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/exam-shell-server-gates.sh

      # E9: the exam seams. Whole exams walked through the E6 runtime functions,
      # scored, and their 'test_session_scored' events consumed as the API does:
      # every miss and blank enqueued for review and nothing else, no duplicate on
      # replay, mastery for submitted sections only, 05C's section-score surface,
      # one projection row per completion, the anonymised student (score computes,
      # no student-keyed row), and a seam failure that never un-scores a test.
      # @spec [SCL-154 .. SCL-158; Doc-04B_V4.3 §16.1; Doc-05A §6.2; Doc-05C §5.7] | @implemented [2026-09-25]
      - name: Exam seams gates (review queue, mastery, projection — E9)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/exam-seams-gates.sh

      # SCL-206: real exams feed the score projection. The two most recent completed
      # full-lengths, in order, never an older third or an abandoned one; NULL below the
      # Q4 gate; the API read-through refreshes only its own session; the drain consumes
      # the rest, survives a row whose refresh raises, and replays as a no-op.
      # @spec [Doc-05C_V1 §5.7, §8.3, §13.1; SCL-206] | @implemented [2026-10-03]
      - name: Projection full-length blend gates (SCL-206)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/projection-full-length-gates.sh

      # G1: the exam report's per-domain breakdown. Ownership (one bare 403), agreement
      # with score_runs' module counts and the served items, the ROUTING PREMISE on the
      # live forms (2A and 2B identical per domain, SCL-160), the row key allowlist,
      # scored sections only, and service_role-only execution.
      # @spec [Doc 04C §8.1/§9.1, §2.3; Doc 04 Parent Q9 as amended by SCL-180; SCL-160] | @implemented [2026-09-27]
      - name: Exam domain breakdown gates (G1)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/exam-domain-breakdown-gates.sh

      # E9b: the calendar's reading of a real exam. Whole exams walked through the E6
      # runtime functions and drained as the API does; then the scope shape, the next-test
      # rule, the plan input's exam facts (missed_count, reviewed, weak_domains from 05B at
      # weak_level_max), the session-scoped exam review, and the anonymised student.
      # @spec [Doc_05F §7.4, §9.4, §10.1; formula sheet §2 step 4, §6; SCL-167 .. SCL-170] | @implemented [2026-09-25]
      - name: Calendar full-length seam gates (G-08-02 — E9b)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/calendar-full-length-gates.sh

      # ── pg16: practice, deletion, mastery, parity, tutor ─────────────────────────

      - name: Practice engine integration gate (SQL seam only — no TS handler)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/practice-integration.sh

      # @spec [Doc 03 §14.2; Doc 05E §3 Rule 4 + §5; Doc 01 V8 §40.5; owner brief 2026-09-17
      #        "Declarative FK Actions, Not an Enumerated Cascade" steps 3-4]
      #        | @implemented [2026-09-17]
      # The cascade used to enumerate table names by hand and nine foreign keys into `profiles`
      # were never added to it, so `DELETE FROM profiles` raised for anyone who had used the
      # tutor. The migration fixes those nine. THIS is what stops the tenth: the guard reads
      # `pg_constraint`, not a list, so a table added tomorrow is in scope the moment it has a
      # foreign key — whether or not anybody remembered the guard file. It also checks the
      # allowlist in both directions and refuses an edge handled both declaratively and
      # procedurally.
      - name: FK delete-action guard (catalog-driven, on a genesis fresh-apply)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/fk-delete-action-guard.sh

      # @spec [R2 (PR #795) shipped these gates; R3 wires them in.]
      # scripts/ci/review-queue-gates.sql landed with the R2 migration and was named in
      # no workflow, so nothing ran it. It is the only cover for the review reveal
      # matrix, the cross-student RLS policies and the EXECUTE grants on the two queue
      # functions — none of which the vitest suites in practice-integration can see, because
      # they connect as the superuser. It runs the gates on correct code first, then plants
      # each; the migrated database is built once and cloned per gate (TEMPLATE).
      - name: Review queue DB gates (reveal matrix, RLS, EXECUTE grants)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ci/review-queue-gates.self-test.sh

      # @spec [owner instruction 2026-08-27 Part B — "make the guards structural, not habitual"]
      # The proof above can only be trusted if its cases can FAIL. Three times in three
      # consecutive steps a case read green while proving nothing — a mutation that never
      # applied, a mutation that reddened an earlier assertion than the one it named, and a
      # precondition that put a different mechanism in the path. Each was caught by hand,
      # which is not a mechanism. This runs the declared mutations and fails the build unless
      # each one turns EXACTLY the cases it claims. It is the LAST step in this job because it
      # patches source files in the working tree and restores them in a finally.

      - name: deidentify_user exact-target + idempotency rehearsal
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/deletion-deidentify-rehearsal.sh

      # F-47 (owner ruling 2026-10-01): the cascade rehearsal's POSITIVE run, blocking.
      # It was red from 2026-09-22 with nothing to report it, because only G15's plant
      # ever ran it — and that plant only asked for "any failure". Seed commits first,
      # in its own transaction, as production's rows always are.
      - name: execute_account_deletion_cascade rehearsal (hard_delete + anonymize, committed seed)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/deletion-cascade-rehearsal.sh

      - name: In-app cancel atomicity (no-strand) rehearsal
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/deletion-cancel-atomicity.sh

      - name: Mastery formula parity (PL/pgSQL == Python reference == Doc 05A §12)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/mastery-parity.sh

      - name: Scoring formula parity (PL/pgSQL == validation_sweep.py, formula + session paths)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/scoring-parity.sh

      - name: Lane-C seam gates (production parity + idempotency replay + txn atomicity + F1/F2/F3 §4.9 re-proof)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/lane-c-seam-gates.sh

      - name: 05B domain mastery + KPI gates (domain-grain parity + INV-05B-13 + KPI struct)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/05b-domain-kpi-gates.sh

      - name: 05C section projection gates (State-A projection parity vs Doc 05C §6 + Q4 gate)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/05c-projection-gates.sh

      - name: Guardian-mirror gates (denial by absence + one gate form + view-only + carve-outs)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/guardian-mirror-gates.sh

      - name: Tutor schema-proof gate
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/tutor-schema-proof.sh

      # The detector reported 84 gaps out of 91 answered items on its first day in
      # production — every item the Step 8 backfill had correctly rebuilt, because
      # backfill_recompute_student writes no per-event audit row. An alert that is
      # 100% noise on arrival gets muted, which is the failure this workstream
      # exists to prevent. N4 reproduces the 84 before asserting the 0.
      - name: Gap-detector noise gate (backfill is not a gap)
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/gap-detector-noise-gate.sh

      # Session lifecycle, steps 2/1/8/9. Seven fixture students; the two that
      # earn their place are E (two ALL-NULL diagnostic_baseline rows — what the
      # evidence gate actually writes, so counting snapshot rows calls them
      # "ready") and G (a completed AND an active diagnostic at once, which is
      # production's real shape and the only way to prove the CASE precedence).
      - name: Session lifecycle DB gate (once-only index, state, abandoned_at)
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          bash scripts/ci/session-lifecycle-db-gate.sh

      - name: Mastery derivation gap detection gate (2.4)
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          source scripts/ci/lib/deletion-rehearsal-db.sh
          setup_genesis_db mastery_gap_ci
          psql -v ON_ERROR_STOP=1 -d mastery_gap_ci -q -f scripts/ci/mastery-gap-detection-gates.sql
        shell: bash

      # Six level names + the drill-down catalog. The catalog replaces SAT_TAXONOMY,
      # whose invented slugs (math/advanced_math/linear_equations) never matched the
      # canonical DB values (M/Advanced Math/Linear Equations in One Variable), so the
      # skill tree resolved every node to NULL for every student.
      - name: Mastery levels + skill catalog gates (RULE 1/2/3/5)
