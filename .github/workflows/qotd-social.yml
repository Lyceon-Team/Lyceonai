# Question of the Day social assets: two images, the caption and the alt text, every day.
#
# @spec [Doc 10A §7, §11; owner decisions 2026-10-07 on the QOTD social assets (delivery as
#   GitHub run downloads, the caption and alt text on the run page; portrait 1080x1350 + story
#   1080x1920; existing tooling only)] | @implemented [2026-10-07]
#
# plain English: at 04:05 UTC (Karl, 2026-10-27: five minutes after the QOTD day turns over at
# 04:00 UTC, fixed, no daylight-saving logic) this builds the new day's assets from the website's own public
# pre-submit payload (/api/public/qotd/today: no answer, no explanation, and only today exists
# there). Karl downloads the zip from the run's Artifacts; the run page shows the caption and
# alt text with a copy button. No database access; the build's only network call is to lyceon.ai.
#
# Slack (owner brief 2026-10-10): once the download is uploaded, a scheduled or hand-started run
# posts the day to Slack (#social): both images, then the caption and alt text, with the date and
# section (scripts/qotd-social/post-to-slack.ts). It posts only from post.json, which the build
# writes only when every check passed, the leak check included; a build that failed never reaches
# the step. A failed run instead posts ONE failure notice (post-to-slack.ts --failure: the
# generator's refusal lines from failure.txt and the run link), so a refused day is visible in
# Slack, never silent (Karl's rulings 2026-10-28, SCL-258: a stored answer-choice order the
# server refuses is a 503 qotd_order_invalid, and the notice names it). The bot token is the GitHub secret SLACK_BOT_TOKEN, read by that one step and nothing
# else; the channel is the variable SOCIAL_SLACK_CHANNEL_ID (or the run's slack_channel input, for
# a test post). A missing token or a Slack error fails the run, after the download is uploaded.
# Pull requests run the same step as a dry run: every check, no token, nothing sent.
# TikTok (Karl, 2026-10-23): the same run builds yesterday's question as a three-slide TikTok
# carousel (qotd-<yesterday>-tiktok-1..3.png, in the same download) and posts it to #social, or a
# one-line note when yesterday is withheld or missing.
# No Reddit (Karl's ruling 2026-10-30: the QOTD subreddit was banned by Reddit sitewide): the run
# builds and posts nothing Reddit-related; the QOTD goes to TikTok, Instagram and Facebook only.
# Breakdown pilot (Karl's brief 2026-11-02, Part C; SCL-266, as ruled on #1398 2026-11-02): a
# second job, `breakdown`, runs AFTER this one, whatever its result, so the QOTD always posts first
# and a breakdown can never block or delay it. Inside the pilot window (shared/qotd/breakdown.ts
# QOTD_BREAKDOWN_PILOT: HELD by Karl 2026-11-03, off until the private repo exists, ruled as posting
# days 2026-11-09 to 2026-11-22 in QOTD_BREAKDOWN_PILOT_RULED; the variable
# QOTD_BREAKDOWN_PAUSED=true stops it at once) it renders yesterday's QOTD as a 30-60 s video with
# the worked-example pipeline from the AUTHORED script for that date, only if GitHub's record shows
# Karl merged it and its order and letter are the stored row; it posts the video to the same
# channel for Karl to post by hand; or, on any fallback reason (no approved script among them),
# yesterday's answer slide and "Breakdown skipped: <reason> (<code>)". Outside the window it does
# nothing. Nothing is voiced here and no Python is set up: the voice is committed with the script.
# The scripts live in the PRIVATE repo Lyceon-Team/lyceon-content-private (Karl's rulings
# 2026-11-02/03: nothing breakdown-specific that names an answer in this public repo), at
# qotd-breakdowns/<week>/<date>/, approved by Karl's merge into its `main`. Scheduled and
# hand-started runs use the `qotd-breakdown` environment (deployments from `main` only), whose
# fine-grained token CONTENT_PRIVATE_TOKEN reads that one repo (Contents + Pull requests: Read);
# the checkout fetches YESTERDAY's folder only (sparse, blob:none: no other day's file content
# reaches the runner) and keeps no credentials. Each video is limited to at most -1 dBTP true peak
# (SCL-270, the worked examples' final-mix.ts) before its MP4 check. Pull requests run it as a dry
# run on the SYNTHETIC fixture (tests/fixtures/qotd-breakdowns-synthetic: a made-up question,
# order and script, no environment and no token): the MP4 is uploaded, nothing sent.
# Setup: docs/runbooks/qotd-slack.md.
#
# Run it by hand with no date for today, or with a PAST date to rebuild that day (today and
# future dates are refused by the script, exit 2). A pull request that touches the generator
# builds the newest archive day instead, so the whole workflow is proven before it merges (a
# schedule only ever runs from the default branch).
name: QOTD social assets

on:
  schedule:
    # 04:05 UTC: the QOTD day turns over at 04:00 UTC (Karl, 2026-10-27). The set is unchanged:
    # 1/3-2/3 the day that just finished (TikTok), 3/3 the new day. A run
    # before the database has switched finds /today still on the old day and is refused (the
    # generator checks it against the 04:00 UTC day), so nothing is posted twice.
    - cron: "5 4 * * *"
  pull_request:
    paths:
      - .github/workflows/qotd-social.yml
      - scripts/qotd-social/**
      - shared/qotd/social.ts
      - shared/qotd/tiktok.ts
      - shared/qotd/reveal.ts
      - shared/qotd/projection.ts
      - shared/qotd/plain-math.ts
      - shared/social/funnel.ts
      - shared/math/tokenize.ts
      - client/src/components/qotd/QotdSocialCard.tsx
      - client/src/components/qotd/QotdTiktokSlide.tsx
      - shared/qotd/readability.ts
      - tests/lib/qotd-fixture.ts
      - tests/fixtures/qotd/rows.json
      - client/src/components/qotd/StaticMath.tsx
      - packages/shared/src/qotd-schema.ts
      - docs/runbooks/qotd-slack.md
      - shared/qotd/breakdown.ts
      - packages/shared/src/qotd-breakdown-schema.ts
      - shared/worked-examples/rules.ts
      - scripts/worked-examples/**
      - video-kit/worked-examples/**
      - shared/slack/client.ts
      - tests/fixtures/qotd-breakdowns-synthetic/**
  workflow_dispatch:
    inputs:
      date:
        description: "A past day, YYYY-MM-DD (leave empty for today)"
        required: false
        default: ""
      slack_channel:
        description: "Slack channel ID for this run only, e.g. a test channel (empty: SOCIAL_SLACK_CHANNEL_ID)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: qotd-social-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      date: ${{ steps.day.outputs.date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium (the build @playwright/test pins)
        run: pnpm exec playwright install --with-deps chromium

      # Karl's brief 2026-10-23: the TikTok slides must fit TikTok's safe area at the caps with the
      # longest choices. Worst-case questions and two real fixture days, through the generator's
      # own renderer; the PNGs are uploaded for review. Pull requests only (the daily build
      # enforces the same safe area on the real day).
      - name: TikTok layout check
        if: github.event_name == 'pull_request'
        run: pnpm exec tsx scripts/qotd-social/tiktok-layout.ts --out qotd-tiktok-layout

      - name: Upload the TikTok layout slides
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: qotd-tiktok-layout
          path: qotd-tiktok-layout/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Build the assets
        env:
          QOTD_DATE: ${{ github.event_name == 'pull_request' && 'latest' || inputs.date }}
        run: |
          if [ -n "${QOTD_DATE:-}" ]; then
            pnpm exec tsx scripts/qotd-social/generate.ts --date "$QOTD_DATE" --out qotd-social-out
          else
            pnpm exec tsx scripts/qotd-social/generate.ts --out qotd-social-out
          fi

      - name: Caption and alt text on the run page
        if: always()
        run: |
          if [ -f qotd-social-out/summary.md ]; then
            cat qotd-social-out/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No assets were produced; see the 'Build the assets' step." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Find the day
        id: day
        if: success()
        run: |
          f="$(ls qotd-social-out/qotd-*-portrait.png qotd-social-out/qotd-*-story.png 2>/dev/null | head -1)"
          d="$(basename "$f" | sed -E 's/^qotd-([0-9-]{10})-.*/\1/')"
          echo "date=$d" >> "$GITHUB_OUTPUT"

      - name: Upload the assets
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qotd-${{ steps.day.outputs.date }}
          path: |
            qotd-social-out/*.png
            qotd-social-out/caption.txt
            qotd-social-out/instagram-caption.txt
            qotd-social-out/alt-text.txt
            qotd-social-out/post.json
          if-no-files-found: error
          retention-days: 30

      # Pull requests: every check the post makes, the message built, nothing sent, no token.
      - name: Slack post (dry run)
        if: success() && github.event_name == 'pull_request'
        run: pnpm exec tsx scripts/qotd-social/post-to-slack.ts --dir qotd-social-out --dry-run

      # After the upload, so a Slack failure never costs the download; it fails the run instead.
      - name: Post to Slack
        if: success() && github.event_name != 'pull_request'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel || vars.SOCIAL_SLACK_CHANNEL_ID }}
        run: pnpm exec tsx scripts/qotd-social/post-to-slack.ts --dir qotd-social-out

      # SCL-258 (Karl, 2026-10-28): a failure is loud. Any failed step on a scheduled or
      # hand-started run posts one notice with the reason and the run link.
      - name: Post the failure to Slack
        if: failure() && github.event_name != 'pull_request'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel || vars.SOCIAL_SLACK_CHANNEL_ID }}
        run: pnpm exec tsx scripts/qotd-social/post-to-slack.ts --dir qotd-social-out --failure

  # The breakdown pilot (SCL-266). After the QOTD job and whatever its result: the QOTD posts
  # first, and nothing here can fail or delay it.
  breakdown:
    needs: assets
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The private repo's token lives in this environment, limited to deployments from `main`: no
    # pull request, fork or other branch can read it. Pull requests run with no environment.
    environment: ${{ github.event_name != 'pull_request' && 'qotd-breakdown' || '' }}
    # This repository is only read; the approval is read from the PRIVATE repo's record of the
    # merge, with CONTENT_PRIVATE_TOKEN (not this job's GITHUB_TOKEN).
    permissions:
      contents: read
    env:
      HYPERFRAMES_NO_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      OUT: qotd-breakdown-out
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pull requests always exercise the breakdown (a dry run on the fixture).
      - name: Pilot window
        id: window
        env:
          QOTD_BREAKDOWN_PAUSED: ${{ vars.QOTD_BREAKDOWN_PAUSED }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then w=dry-run; else w="$(pnpm exec tsx scripts/qotd-social/breakdown.ts window)"; fi
          echo "window=$w" >> "$GITHUB_OUTPUT"
          echo "qotd-breakdown: window $w"

      - name: Install Chromium (the build @playwright/test pins) and FFmpeg
        if: steps.window.outputs.window == 'active' || steps.window.outputs.window == 'dry-run'
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-color-emoji
          shell=$(find "$HOME/.cache/ms-playwright" -type f \( -name headless_shell -o -name chrome-headless-shell \) -path '*chromium_headless_shell-*' | head -1)
          test -x "$shell"
          echo "HYPERFRAMES_BROWSER_PATH=$shell" >> "$GITHUB_ENV"

      # Yesterday's folder in the private repo: the one path the checkout below fetches. Its QOTD
      # day closed at 04:00 UTC, so its answer is public; no other day is fetched.
      - name: Yesterday's script folder
        id: target
        if: github.event_name != 'pull_request' && steps.window.outputs.window == 'active'
        run: |
          t="$(pnpm exec tsx scripts/qotd-social/breakdown.ts target)"
          echo "dir=$t" >> "$GITHUB_OUTPUT"
          echo "qotd-breakdown: target $t"

      # The approved script and its committed voice, with the commit history the approval is read
      # from (blob:none: commits and trees only, so no other day's file content is downloaded).
      - name: Checkout the private repo (yesterday's folder only, read-only token)
        if: github.event_name != 'pull_request' && steps.window.outputs.window == 'active'
        uses: actions/checkout@v4
        with:
          repository: Lyceon-Team/lyceon-content-private
          ref: main
          token: ${{ secrets.CONTENT_PRIVATE_TOKEN }}
          path: content-private
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: ${{ steps.target.outputs.dir }}
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Yesterday's answer slide (the carousel's slide 3) for the fallback, from the QOTD run.
      - name: Download the QOTD assets
        if: github.event_name != 'pull_request' && steps.window.outputs.window == 'active' && needs.assets.outputs.date != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: qotd-${{ needs.assets.outputs.date }}
          path: qotd-social-out

      - name: Build the breakdown
        env:
          QOTD_BREAKDOWN_PAUSED: ${{ vars.QOTD_BREAKDOWN_PAUSED }}
          CONTENT_PRIVATE_TOKEN: ${{ secrets.CONTENT_PRIVATE_TOKEN }}
          CONTENT_APPROVER_LOGIN: ${{ vars.CONTENT_APPROVER_LOGIN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec tsx scripts/qotd-social/breakdown.ts build --content tests/fixtures/qotd-breakdowns-synthetic/content \
              --fixture tests/fixtures/qotd-breakdowns-synthetic/rows.json \
              --date 2026-01-14 --now 2026-01-15T04:05:00Z --dry-run --out "$OUT"
          else
            pnpm exec tsx scripts/qotd-social/breakdown.ts build --content content-private --out "$OUT"
          fi

      - name: Breakdown on the run page
        if: always()
        run: |
          if [ -f "$OUT/summary.md" ]; then cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else echo "No breakdown summary: see 'Build the breakdown'." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the breakdown video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qotd-breakdown
          path: |
            ${{ env.OUT }}/*.mp4
            ${{ env.OUT }}/breakdown.json
          if-no-files-found: ignore
          retention-days: 14

      # Pull requests: every message built, nothing sent, no token.
      - name: Breakdown Slack post (dry run)
        if: always() && github.event_name == 'pull_request'
        run: pnpm exec tsx scripts/qotd-social/breakdown.ts post --dir "$OUT" --assets qotd-social-out --dry-run

      # The video, or the answer slide and "Breakdown skipped: <reason>"; nothing outside the window.
      # A build that did not finish still posts its notice (build_failed).
      - name: Breakdown Slack post
        if: always() && github.event_name != 'pull_request' && steps.window.outputs.window == 'active'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel || vars.SOCIAL_SLACK_CHANNEL_ID }}
        run: pnpm exec tsx scripts/qotd-social/breakdown.ts post --dir "$OUT" --assets qotd-social-out
