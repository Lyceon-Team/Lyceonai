<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Student UI fonts (Source Sans 3 / Source Serif 4, register UI-12, UI-40) are NOT preloaded
         here: this head is every page's, and public pages never render them, so a preload made
         each public page download ~50 KB it did not use. student-tokens.css declares them with
         @font-face, so they download when the student shell (.lyc) first renders text in them
         (font-display: swap). SEO follow-up, 2026-10-05, pending Karl's confirmation. -->
    <!-- Student UI theme before first paint (register UI-47): the same rule as
         client/src/lib/theme.ts (resolveTheme), kept in step by client/src/lib/theme.boot.test.ts.
         Writes <html data-theme>, which client/src/styles/student-tokens.css reads. -->
    <script id="lyceon-theme-boot">
      (function () {
        var p = null;
        try { p = window.localStorage.getItem("lyceon-theme"); } catch (e) { p = null; }
        if (p !== "light" && p !== "dark") p = "system";
        var dark = p === "dark" || (p === "system" && typeof window.matchMedia === "function" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Page head (F1). Every public page is prerendered at build by
         scripts/build/prerender.mjs, which replaces everything between these markers with
         that page's own title, description, self-canonical, Open Graph/Twitter tags and
         JSON-LD from shared/seo/. What is left here is the head of the SPA shell (app.html),
         which serves only signed-in and non-content routes: none of them is meant for an
         index, so the shell says noindex and names no canonical. -->
    <!-- seo:head:start -->
    <title>Lyceon – Digital SAT prep with tutor guidance</title>
    <meta name="robots" content="noindex" />
    <!-- seo:head:end -->

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png" />

    <!-- Web fonts are self-hosted (client/public/fonts/, declared in client/src/index.css), so
         no page requests a Google domain. These preload the two faces the homepage renders above
         the fold, Poppins 400 (body) and 700 (the h1); every other face loads on first use. Each
         href equals its @font-face src exactly, and `crossorigin` is required for a font
         preload to be reused. -->
    <link rel="preload" href="/fonts/poppins-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/poppins-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
