<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Student UI fonts, self-hosted (register UI-12, UI-40; approved 2026-10-02). -->
    <link rel="preload" href="/fonts/source-sans-3-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/source-serif-4-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Student UI theme before first paint (register UI-47): the same rule as
         client/src/lib/theme.ts (resolveTheme), kept in step by client/src/lib/theme.boot.test.ts.
         Writes <html data-theme>, which client/src/styles/student-tokens.css reads. -->
    <script id="lyceon-theme-boot">
      (function () {
        var p = null;
        try { p = window.localStorage.getItem("lyceon-theme"); } catch (e) { p = null; }
        if (p !== "light" && p !== "dark") p = "system";
        var dark = p === "dark" || (p === "system" && typeof window.matchMedia === "function" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    
    <!-- SEO Meta Tags -->
    <title>Lyceon – Digital SAT prep with tutor guidance</title>
    <meta name="description" content="Lyceon offers SAT-style practice, full-length exams, progress tracking, and tutor guidance to help you study smarter and improve score readiness." />
    <meta name="keywords" content="Lyceon, SAT, SAT prep, digital SAT practice, SAT-style questions, SAT math help, SAT reading help, SAT study app, tutor guidance" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://lyceon.ai/" />
    
    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png" />
    
    <!-- Open Graph Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lyceon" />
    <meta property="og:title" content="Lyceon – Digital SAT prep with tutor guidance" />
    <meta property="og:description" content="Practice SAT-style questions with tutor guidance, full-length exams, and progress tracking." />
    <meta property="og:url" content="https://lyceon.ai/" />
    <meta property="og:image" content="https://lyceon.ai/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lyceon – Digital SAT prep with tutor guidance" />
    
    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lyceon – Digital SAT prep with tutor guidance" />
    <meta name="twitter:description" content="SAT-style practice, full-length exams, and tutor guidance for Digital SAT readiness." />
    <meta name="twitter:image" content="https://lyceon.ai/og-image.jpg" />
    
    <!-- JSON-LD is injected server-side for SSR public routes -->
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Only the two families the app renders with: Poppins and Inter (index.css and tokens.css
         font stacks, tailwind.config.ts, calendar.css). Poppins keeps the previous link's faces.
         Inter is requested without the opsz axis because the removed index.css @import served
         that face for weights 400-600 and, loading later, is what rendered them.
         Student-ui register UI-12, 2026-09-29. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
