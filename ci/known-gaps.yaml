# =============================================================================
# ACCEPTED FAILURES — every entry expires
# =============================================================================
# This file replaces the `ci-known-gaps` job's three permanent
# `continue-on-error` steps. A suppression nobody has to renew is a deletion
# with extra steps: it removes the signal and leaves the check in place, which
# misrepresents the repo's standard to anyone reading the workflow.
#
# EVERY entry MUST carry: id, owner, expires, reason, re_arm, command,
# count_command, findings_ceiling, tolerance, ceiling_source.
# `scripts/ci/known-gaps-gate.mjs` REJECTS an entry missing any of them, and
# turns CI red once `expires` is in the past. The schema is the enforcement —
# not convention, not review diligence.
#
# The gate runs BLOCKING. The accepted checks themselves run non-blocking. So a
# check can fail without failing CI, but the PERMISSION for it to fail cannot be
# open-ended, cannot be undocumented, and cannot silently GROW: `count_command`
# measures the current finding count and the gate fails when it exceeds
# `findings_ceiling`. A gap is accepted at a size, not in perpetuity and not at
# any size.
#
# WHO MEASURES. The CI runner's reading is authoritative; a local reading is
# advisory. The gate is fatal on a count only when CI=1 is set. This exists
# because a ratchet that fires or passes depending on which machine measured last
# gets loosened until it stops firing, and then it is decoration.
#
# `tolerance` is how much genuine environment spread the ceiling absorbs, and it
# lives HERE rather than in the gate on purpose: a tolerance widened inside the
# gate is invisible to anyone reading this file to find out what was accepted and
# at what size. It must be stated even when it is 0.
#
# `ceiling_source` names where the number on record was measured. A count is only
# comparable to another count taken the same way, on the same tree, by the same
# toolchain.
#
# To add an entry you must name a person and a date. If you cannot, it is not an
# accepted gap — it is an unreported failure, and it belongs in the build.
#
# EMPTY ON PURPOSE. The list is declared empty with `entries: []` — a bare
# `entries:` with no blocks is still refused as a possible parse failure. To add
# an entry, replace `[]` with the first `- id:` block.
#
# History: eslint-legacy-tree (owner karl, expires 2026-11-01) was deleted on
# 2026-10-07 when `pnpm run lint` reached 0 problems on the whole repository
# (owner decision: resolve it before it expired). Lint now runs BLOCKING in the
# required `ci` job. Its last accepted ceiling was 1906; the full entry is in
# this file's history.
# =============================================================================

entries: []
