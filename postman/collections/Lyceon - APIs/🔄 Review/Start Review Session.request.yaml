$kind: http-request
url: "{{baseUrl}}/api/review/sessions"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "mode": "queue",
      "client_instance_id": "{{clientInstanceId}}",
      "idempotency_key": "{{$guid}}"
    }
scripts:
  - type: afterResponse
    code: >-
      if (pm.response.code === 200 || pm.response.code === 201) {
          var json = pm.response.json();
          if (json.sessionId) pm.collectionVariables.set('reviewSessionId', json.sessionId);
      }
    language: text/javascript
order: 2000
